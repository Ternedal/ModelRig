name: One-shot current-state regeneration for PR 2320
on:
  push:
    branches: [feat/native-handoff-projection-2319]
    paths:
      - .github/workflows/pr2320-regenerate-state.yml
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'Ternedal/ModelRig' && github.ref == 'refs/heads/feat/native-handoff-projection-2319'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: pip install -r worker/requirements.txt
      - name: Generate canonical file and remove one-shot workflow
        run: |
          set -euo pipefail
          python3 scripts/current_state.py
          git diff --check
          git rm .github/workflows/pr2320-regenerate-state.yml
          git add CURRENT_STATE.md
          git diff --cached --stat
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: regenerate CURRENT_STATE for handoff projection'
          git push origin HEAD:feat/native-handoff-projection-2319

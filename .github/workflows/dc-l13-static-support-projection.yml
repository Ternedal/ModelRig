name: dc-l13-static-support-projection

on:
  pull_request:
    paths:
      - .github/workflows/dc-l13-static-support-projection.yml

permissions:
  contents: write

jobs:
  project:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install exact asymmetric verifier dependency
        run: pip install --quiet cryptography==49.0.0
      - name: Project static support and validate imports
        shell: bash
        run: |
          set -euo pipefail
          python .github/dc-l13-project-static-support.py
          python -m py_compile \
            devcontrol/src/kaliv_dev_control/_local_candidate_materialization_legacy/__init__.py \
            devcontrol/src/kaliv_dev_control/local_candidate_materialization.py \
            devcontrol/src/kaliv_dev_control/local_candidate_materialization_h5c.py
          PYTHONPATH=devcontrol/src python - <<'PY'
          import inspect
          import kaliv_dev_control._local_candidate_materialization_legacy as support
          import kaliv_dev_control.local_candidate_materialization as materialization
          import kaliv_dev_control.local_candidate_materialization_h5c as asymmetric

          assert callable(materialization.materialize_local_candidate)
          assert callable(materialization.verify_local_candidate_materialization)
          assert callable(asymmetric.materialize_asymmetric_local_candidate)
          for name in (
              "TrustedLocalGit",
              "materialize_local_candidate",
              "verify_local_candidate_materialization",
              "LocalCandidateMaterializationGate",
          ):
              assert not hasattr(support, name), name
          source = inspect.getsource(support)
          for token in (
              "import subprocess",
              "globals().update",
              "._compatibility_v1",
              "subprocess.run",
          ):
              assert token not in source, token
          PY
          rm .github/dc-l13-project-static-support.py
          rm .github/workflows/dc-l13-static-support-projection.yml
          git config user.name "ModelRig DevControl"
          git config user.email "devcontrol@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(devcontrol): replace legacy proxy with static L13 support"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

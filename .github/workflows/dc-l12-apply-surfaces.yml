name: dc-l12-apply-surfaces

on:
  pull_request:
    paths:
      - .github/workflows/dc-l12-apply-surfaces.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply non-workflow integration surface
        shell: bash
        run: |
          set -euo pipefail
          python .github/dc-l12-patch-surfaces.py
          echo "9c00480853cfb1e27027e359aa5b32675726f8f940c94f132a3cd8f71df466cd  tests/workflow_test_coverage.py" | sha256sum -c -
          python -m py_compile tests/workflow_test_coverage.py
          git restore .github/workflows/_tests.yml
          rm -f .github/dc-l12-patched-surfaces.tgz.b64
          rm -f .github/dc-l12-patch-surfaces.py
          git config user.name "ModelRig DevControl"
          git config user.email "devcontrol@users.noreply.github.com"
          git add tests/workflow_test_coverage.py .github/dc-l12-patched-surfaces.tgz.b64 .github/dc-l12-patch-surfaces.py
          git diff --cached --check
          git commit -m "test(devcontrol): advance exact coverage through DC-L12"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

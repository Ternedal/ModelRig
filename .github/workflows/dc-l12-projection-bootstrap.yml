name: dc-l12-projection-bootstrap

on:
  push:
    branches:
      - agent/devcontrol-dc-l12-authorization-recovery
    paths:
      - .github/workflows/dc-l12-projection-bootstrap.yml

permissions:
  contents: write

jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply bounded DC-L12 projection
        shell: bash
        run: |
          python - <<'PY'

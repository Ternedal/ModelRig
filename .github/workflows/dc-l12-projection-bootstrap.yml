          root = Path.cwd()
          pkg = root / "devcontrol/src/kaliv_dev_control"
          tests = root / "devcontrol/tests"

          support = r'''"""Static support types for the DC-L12 publisher evidence chain.

This module deliberately contains only canonical value objects, validators and
read-only policy identities.  It contains no HMAC issuer, shared secret, private
key, signer, credential value, transport, subprocess or remote-write adapter.
"""
from __future__ import annotations

import hashlib
import json
import re
from dataclasses import dataclass
from datetime import datetime, timezone
from pathlib import Path
from typing import Any, Callable, Mapping, TypeVar

from .publisher_dry_run import PublisherRequestVerifier, SignedPublisherRequest
from .semantic_review import SemanticReviewVerifier

_REMOTE_REPOSITORY_SCHEMA = "kaliv-development-remote-repository-identity/v1"
_CREDENTIAL_POLICY_SCHEMA = "kaliv-development-publisher-credential-policy/v1"
_AUTHORIZATION_POLICY_DOMAIN = b"kaliv-publisher-authorization-policy/v1\0"
_CREDENTIAL_POLICY_DOMAIN = b"kaliv-publisher-credential-policy/v1\0"
_HEX64 = re.compile(r"^[0-9a-f]{64}$")
_ACTOR_ID = re.compile(r"^[A-Za-z0-9][A-Za-z0-9_.@-]{1,127}$")
_IDENTIFIER = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._-]{2,127}$")
_REPOSITORY = re.compile(r"^[^/\s]+/[^/\s]+$")
_REPOSITORY_ID = re.compile(r"^[1-9][0-9]{0,39}$")
_UTC_TIMESTAMP = re.compile(r"^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$")
_MAX_ARTIFACT_BYTES = 128 * 1024 * 1024
T = TypeVar("T")

PUBLISHER_AUTHORIZATION_POLICY = (
    "Accept only one complete signed publisher request that still verifies against the exact task, trusted publisher, trusted semantic reviewer and current execution authority.",
    "Require a separately authenticated authorization issuer who differs from the developer, semantic reviewer and publisher.",
    "Bind one exact invocation nonce, one immutable remote-repository identity and one fixed least-privilege credential policy.",
    "Limit every lease to one use and at most fifteen minutes with an explicit issue and expiry timestamp.",
    "Consume the invocation nonce through one atomic create-once replay-ledger entry before producing preflight evidence.",
    "Keep credentials, Git transport, network writes, reviewer requests, ready-for-review, merge, release, settings, deployment and runtime activation outside this boundary.",
    "Fail closed on any task, authority, signature, time, repository, policy, nonce, replay, canonical-byte or no-write-boundary mismatch.",
)
_ALLOWED_PERMISSIONS = (
    "contents:write:exact-proposed-branch-only",
    "pull_requests:write:create-exact-draft-only",
)
_DENIED_CAPABILITIES = (
    "actions-and-workflows", "administration", "base-branch-write", "checks",
    "deployments", "environments", "force-push", "issues", "members", "merge",
    "packages", "pages", "ready-for-review", "release", "repository-settings",
    "reviewer-requests", "secrets-and-variables", "tag-write", "webhooks",
)

class PublisherAuthorizationError(ValueError):
    """Publisher authorization, replay or recovery evidence is invalid."""


def _canonical(value: Mapping[str, Any]) -> str:
    return json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":"))


def _sha256_bytes(value: bytes) -> str:
    return hashlib.sha256(value).hexdigest()


def _strict(value: Any, *, name: str, fields: set[str]) -> Mapping[str, Any]:
    if not isinstance(value, Mapping) or set(value) != fields:
        raise PublisherAuthorizationError(f"{name} fields mismatch")
    return value


def _clean_text(value: Any, *, name: str, maximum: int, one_line: bool = False) -> str:
    if (not isinstance(value, str) or not value or value.strip() != value or "\x00" in value
            or len(value.encode("utf-8")) > maximum
            or (one_line and ("\n" in value or "\r" in value))):
        raise PublisherAuthorizationError(f"{name} is invalid")
    return value


def _hex(value: Any, *, name: str, pattern: re.Pattern[str] = _HEX64) -> str:
    if not isinstance(value, str) or pattern.fullmatch(value) is None:
        raise PublisherAuthorizationError(f"{name} is invalid")
    return value


def _actor(value: Any, *, name: str) -> str:
    if not isinstance(value, str) or _ACTOR_ID.fullmatch(value) is None:
        raise PublisherAuthorizationError(f"{name} is invalid")
    return value


def _identifier(value: Any, *, name: str) -> str:
    if not isinstance(value, str) or _IDENTIFIER.fullmatch(value) is None:
        raise PublisherAuthorizationError(f"{name} is invalid")
    return value


def _utc(value: Any, *, name: str) -> datetime:
    if not isinstance(value, str) or _UTC_TIMESTAMP.fullmatch(value) is None:
        raise PublisherAuthorizationError(f"{name} must be canonical UTC seconds")
    try:
        return datetime.strptime(value, "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=timezone.utc)
    except ValueError as exc:
        raise PublisherAuthorizationError(f"{name} is invalid") from exc


def _has_linkish_component(path: Path) -> bool:
    current = path.absolute()
    while True:
        if current.is_symlink():
            return True
        is_junction = getattr(current, "is_junction", None)
        if is_junction is not None and is_junction():
            return True
        if current.parent == current:
            return False
        current = current.parent


def _load_canonical(path: Path, parser: Callable[[Any], T], *, name: str) -> T:
    source = Path(path)
    if (not source.is_absolute() or source.is_symlink() or not source.is_file()
            or _has_linkish_component(source.parent)):
        raise PublisherAuthorizationError(f"{name} path is unsafe")
    payload = source.read_bytes()
    if len(payload) > _MAX_ARTIFACT_BYTES:
        raise PublisherAuthorizationError(f"{name} exceeds its byte bound")
    try:
        raw = json.loads(payload.decode("utf-8"))
    except (UnicodeDecodeError, json.JSONDecodeError) as exc:
        raise PublisherAuthorizationError(f"{name} is invalid") from exc
    value = parser(raw)
    canonical_json = getattr(value, "canonical_json", None)
    if canonical_json is None or canonical_json().encode("utf-8") != payload:
        raise PublisherAuthorizationError(f"{name} is not canonical")
    return value


def publisher_authorization_policy_sha256() -> str:
    payload = json.dumps(list(PUBLISHER_AUTHORIZATION_POLICY), ensure_ascii=False, separators=(",", ":")).encode("utf-8")
    return _sha256_bytes(_AUTHORIZATION_POLICY_DOMAIN + payload)


def publisher_credential_policy_rules_sha256() -> str:
    payload = json.dumps({"allowed_permissions": list(_ALLOWED_PERMISSIONS), "denied_capabilities": list(_DENIED_CAPABILITIES)}, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode("utf-8")
    return _sha256_bytes(_CREDENTIAL_POLICY_DOMAIN + payload)


@dataclass(frozen=True, slots=True)
class RemoteRepositoryIdentity:
    repository: str
    repository_id: str
    provider: str = "github"
    host: str = "github.com"
    schema: str = _REMOTE_REPOSITORY_SCHEMA
    def __post_init__(self) -> None:
        if self.schema != _REMOTE_REPOSITORY_SCHEMA or self.provider != "github" or self.host != "github.com":
            raise PublisherAuthorizationError("remote repository provider is unsupported")
        if not isinstance(self.repository, str) or _REPOSITORY.fullmatch(self.repository) is None:
            raise PublisherAuthorizationError("remote repository name is invalid")
        if not isinstance(self.repository_id, str) or _REPOSITORY_ID.fullmatch(self.repository_id) is None:
            raise PublisherAuthorizationError("remote repository ID is invalid")
    @classmethod
    def github(cls, *, repository: str, repository_id: str) -> "RemoteRepositoryIdentity":
        return cls(repository=repository, repository_id=repository_id)
    @classmethod
    def from_mapping(cls, value: Any) -> "RemoteRepositoryIdentity":
        data = _strict(value, name="remote repository identity", fields={"schema", "provider", "host", "repository", "repository_id"})
        return cls(**data)
    def to_dict(self) -> dict[str, str]:
        return {"schema": self.schema, "provider": self.provider, "host": self.host, "repository": self.repository, "repository_id": self.repository_id}
    def canonical_json(self) -> str:
        return _canonical(self.to_dict())
    @property
    def sha256(self) -> str:
        return _sha256_bytes(self.canonical_json().encode("utf-8"))


@dataclass(frozen=True, slots=True)
class PublisherCredentialPolicy:
    remote_repository_sha256: str
    repository: str
    head_branch: str
    allowed_permissions: tuple[str, ...]
    denied_capabilities: tuple[str, ...]
    rules_sha256: str
    token_material_present: bool = False
    reusable_credential_allowed: bool = False
    branch_scope_exact: bool = True
    draft_pr_only: bool = True
    maximum_uses: int = 1
    schema: str = _CREDENTIAL_POLICY_SCHEMA
    def __post_init__(self) -> None:
        if self.schema != _CREDENTIAL_POLICY_SCHEMA:
            raise PublisherAuthorizationError("unsupported publisher credential policy schema")
        _hex(self.remote_repository_sha256, name="remote repository hash")
        if not isinstance(self.repository, str) or _REPOSITORY.fullmatch(self.repository) is None:
            raise PublisherAuthorizationError("credential policy repository is invalid")
        _clean_text(self.head_branch, name="credential policy branch", maximum=200, one_line=True)
        if self.allowed_permissions != _ALLOWED_PERMISSIONS or self.denied_capabilities != _DENIED_CAPABILITIES:
            raise PublisherAuthorizationError("credential policy is not least privilege")
        if self.rules_sha256 != publisher_credential_policy_rules_sha256():
            raise PublisherAuthorizationError("credential policy rules hash is unsupported")
        if self.token_material_present or self.reusable_credential_allowed or not self.branch_scope_exact or not self.draft_pr_only or self.maximum_uses != 1:
            raise PublisherAuthorizationError("credential policy authority boundary is invalid")
    @classmethod
    def for_request(cls, *, signed_request: SignedPublisherRequest, remote_repository: RemoteRepositoryIdentity) -> "PublisherCredentialPolicy":
        if not isinstance(signed_request, SignedPublisherRequest) or not isinstance(remote_repository, RemoteRepositoryIdentity):
            raise PublisherAuthorizationError("credential policy inputs are invalid")
        request = signed_request.request
        if remote_repository.repository != request.repository:
            raise PublisherAuthorizationError("remote repository does not match publisher request")
        return cls(remote_repository_sha256=remote_repository.sha256, repository=request.repository, head_branch=request.head_branch, allowed_permissions=_ALLOWED_PERMISSIONS, denied_capabilities=_DENIED_CAPABILITIES, rules_sha256=publisher_credential_policy_rules_sha256())
    @classmethod
    def from_mapping(cls, value: Any) -> "PublisherCredentialPolicy":
        fields = {"schema", "remote_repository_sha256", "repository", "head_branch", "allowed_permissions", "denied_capabilities", "rules_sha256", "token_material_present", "reusable_credential_allowed", "branch_scope_exact", "draft_pr_only", "maximum_uses"}
        data = dict(_strict(value, name="publisher credential policy", fields=fields))
        if not isinstance(data["allowed_permissions"], list) or not isinstance(data["denied_capabilities"], list):
            raise PublisherAuthorizationError("credential policy capability sets must be arrays")
        data["allowed_permissions"] = tuple(data["allowed_permissions"])
        data["denied_capabilities"] = tuple(data["denied_capabilities"])
        return cls(**data)
    def to_dict(self) -> dict[str, Any]:
        return {"schema": self.schema, "remote_repository_sha256": self.remote_repository_sha256, "repository": self.repository, "head_branch": self.head_branch, "allowed_permissions": list(self.allowed_permissions), "denied_capabilities": list(self.denied_capabilities), "rules_sha256": self.rules_sha256, "token_material_present": self.token_material_present, "reusable_credential_allowed": self.reusable_credential_allowed, "branch_scope_exact": self.branch_scope_exact, "draft_pr_only": self.draft_pr_only, "maximum_uses": self.maximum_uses}
    def canonical_json(self) -> str:
        return _canonical(self.to_dict())
    @property
    def sha256(self) -> str:
        return _sha256_bytes(self.canonical_json().encode("utf-8"))



name: loc-metrics

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loc:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact checkout authority
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Self-test LOC collector
        run: python scripts/loc_metrics.py --self-test
      - name: Collect LOC metrics
        run: python scripts/loc_metrics.py --json loc-metrics.json --markdown loc-summary.md
      - name: Publish job summary
        shell: bash
        run: cat loc-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload LOC metrics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loc-metrics-${{ github.sha }}
          path: |
            loc-metrics.json
            loc-summary.md
          if-no-files-found: error

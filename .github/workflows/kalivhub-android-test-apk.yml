name: KalivHub opt-in Android acceptance APK
on:
  pull_request:
    paths:
      - android/app/src/main/java/dk/ternedal/modelrig/net/HubMirrorClient.kt
      - android/app/src/main/java/dk/ternedal/modelrig/data/TokenStore.kt
      - android/app/src/main/java/dk/ternedal/modelrig/ui/AppUi.kt
      - android/app/src/test/java/dk/ternedal/modelrig/net/HubMirrorClientTest.kt
      - android/app/src/test/java/dk/ternedal/modelrig/net/HubMirrorClientWireTest.kt
      - android/app/src/test/java/dk/ternedal/modelrig/data/HubMirrorPreferencesTest.kt
      - android/app/src/a425f/res/values/strings.xml
      - .github/workflows/kalivhub-android-test-apk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-isolated-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Assert checkout authority
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools
      - name: Set up build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build separately installed test APK
        working-directory: android
        run: |
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
          ./gradlew :app:assembleA425f --no-daemon --console=plain
      - name: Verify exactly one APK
        run: |
          set -euo pipefail
          path="android/app/build/outputs/apk/a425f/app-a425f.apk"
          test -s "$path"
          sha256sum "$path"
          # The side-installed app must not use production's application ID.
          aapt="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/35.0.0/aapt"
          test -x "$aapt"
          "$aapt" dump badging "$path" > apk-badging.txt
          grep -F "package: name='dk.ternedal.modelrig.a425f'" apk-badging.txt
          grep -F "application-label:'Kaliv TEST" apk-badging.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: kalivhub-mirror-android-a425f-test-apk
          path: android/app/build/outputs/apk/a425f/app-a425f.apk
          if-no-files-found: error
          retention-days: 14

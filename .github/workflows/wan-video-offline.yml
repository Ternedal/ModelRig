name: Wan video offline tests

on:
  push:
    branches:
      - feat/wan-video-generation
  pull_request:
    paths:
      - 'worker/app/video_*.py'
      - 'worker/tests/test_video_*.py'
      - '.github/workflows/wan-video-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

# Superseded pushes must not consume runner capacity or report stale results.
concurrency:
  group: wan-video-offline-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  video-offline:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install API test dependencies
        run: python -m pip install fastapi httpx
      - name: Run offline video tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_video_*.py' -v

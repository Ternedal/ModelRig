name: Temporary A4-20 fix applicator

on:
  push:
    branches:
      - agent/a4-20-android-response-epoch

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out A4-20 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/a4-20-android-response-epoch
          fetch-depth: 0

      - name: Apply exact source and fixture corrections
        shell: python
        run: |
          from pathlib import Path

          client_path = Path('android/app/src/main/java/dk/ternedal/modelrig/net/Agent4OperatorClient.kt')
          client = client_path.read_text(encoding='utf-8')
          old = '''    private fun JSONArray.strings(label: String): List<String> = buildList {
                  for (index in 0 until length()) {
                      val value = get(index)
                      if (value !is String || value.isBlank()) {
                          throw protocol("Agent 4-$label indeholder ugyldig tekst")
                      }
                      add(value)
                  }
              }
          '''
          new = '''    private fun JSONArray.strings(label: String): List<String> = buildList {
                  for (index in 0 until this@strings.length()) {
                      val value = this@strings.get(index)
                      if (value !is String || value.isBlank()) {
                          throw protocol("Agent 4-$label indeholder ugyldig tekst")
                      }
                      add(value)
                  }
              }
          '''
          if client.count(old) != 1:
              raise SystemExit(f'expected one JSONArray.strings block, found {client.count(old)}')
          client_path.write_text(client.replace(old, new), encoding='utf-8')

          test_path = Path('android/app/src/test/java/dk/ternedal/modelrig/net/Agent4OperatorClientTest.kt')
          tests = test_path.read_text(encoding='utf-8')
          replacements = {
              'head = timelineCursor(1, "h")': 'head = timelineCursor(1, "b")',
              'head = evidenceCursor(1, "i")': 'head = evidenceCursor(1, "c")',
              'timelineEntry("other-campaign", 1, "j")': 'timelineEntry("other-campaign", 1, "d")',
              'next = timelineCursor(1, "j")': 'next = timelineCursor(1, "d")',
              'head = timelineCursor(1, "j")': 'head = timelineCursor(1, "d")',
              'evidenceRecord("other-campaign", 1, "k")': 'evidenceRecord("other-campaign", 1, "e")',
              'next = evidenceCursor(1, "k")': 'next = evidenceCursor(1, "e")',
              'head = evidenceCursor(1, "k")': 'head = evidenceCursor(1, "e")',
              'timelineEntry("campaign-1", 1, "g")': 'timelineEntry("campaign-1", 1, "c")',
              'next = timelineCursor(1, "g")': 'next = timelineCursor(1, "c")',
          }
          for before, after in replacements.items():
              count = tests.count(before)
              if count != 1:
                  raise SystemExit(f'expected one fixture occurrence for {before!r}, found {count}')
              tests = tests.replace(before, after)
          test_path.write_text(tests, encoding='utf-8')

      - name: Commit corrections
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            android/app/src/main/java/dk/ternedal/modelrig/net/Agent4OperatorClient.kt \
            android/app/src/test/java/dk/ternedal/modelrig/net/Agent4OperatorClientTest.kt
          git commit -m "fix(agent4): preserve strict JSON receiver and valid hash fixtures"
          git push origin HEAD:agent/a4-20-android-response-epoch

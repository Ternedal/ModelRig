name: release-v2.0.18-upgrade-notes

on:
  push:
    branches: [release/v2.0.18-upgrade-notes-20261020]

permissions:
  contents: write
  actions: read

jobs:
  document-updater-first-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5d535a8d391f25677c0e3d85e82eb8a9360c796b
          persist-credentials: false
      - name: Add verified upgrade recipe to this draft only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          REPO = 'Ternedal/ModelRig'
          TAG = 'v2.0.18'
          HEAD = '5d535a8d391f25677c0e3d85e82eb8a9360c796b'
          RUN = 39379849897

          def api(path, method='GET', payload=None):
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + REPO + path,
                  data=None if payload is None else json.dumps(payload).encode(),
                  method=method,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def validate_target(tag, run, release, notes):
              if tag['object']['type'] != 'commit' or tag['object']['sha'] != HEAD:
                  raise SystemExit('Release tag identity changed.')
              if (run['id'] != RUN or run['head_sha'] != HEAD
                      or run['head_branch'] != TAG
                      or run['path'] != '.github/workflows/build-and-release.yml'
                      or run['event'] != 'workflow_dispatch'
                      or run['conclusion'] not in (None, 'success')):
                  raise SystemExit('Unexpected release workflow identity or result.')
              if release['tag_name'] != TAG or not release['draft']:
                  raise SystemExit('Expected the unpublished v2.0.18 draft.')
              if (release.get('body') or '').strip() not in ('', notes.strip()):
                  raise SystemExit('Release notes changed; refusing to overwrite them.')

          document = Path('docs/VOICE_STARTUP_RECOVERY.md').read_text(encoding='utf-8')
          recipes = re.findall(r'```powershell\n(.*?)```', document, re.S)
          if len(recipes) != 1 or "-eq '2.0.18'" not in recipes[0]:
              raise SystemExit('Expected the documented v2.0.18 updater guard.')
          notes = '''Fixes premature worker restarts and updater rollback during first startup of the bundled voice/CUDA worker.

          The supervisor allows a live process up to three minutes before its first healthy response. The updater waits up to five minutes per service. Crash recovery, checksum/provenance verification, whole-set rollback and supervisor heartbeat verification remain required.

          ### Upgrade the Windows rig

          The installed v2.0.16/v2.0.17 updater has the earlier readiness timeout. Update the updater first; this sequence waits for its replacement and verifies v2.0.18 before upgrading the appliance:

          ```powershell
          ''' + recipes[0] + '''```

          ### Validation

          - The real frozen Windows voice worker passed startup under the production supervisor with a deliberate 65-second launch delay. The updater accepted it after 92.08 seconds without a watchdog restart, and the supervisor heartbeat advanced.
          - Startup and recovery tests passed with the race detector on Windows and Linux.
          - The upgrade recipe passed native PowerShell 5.1 and 7 fixtures for immediate/delayed replacement and blocked failure, missing replacement and stuck-lock cases.

          GPU inference, microphone and Android acceptance on the physical rig still require the rig test. These automated checks do not claim that acceptance.

          [Startup recovery details](https://github.com/Ternedal/ModelRig/blob/v2.0.18/docs/VOICE_STARTUP_RECOVERY.md)
          '''
          tag = api('/git/ref/tags/' + TAG)
          run = api('/actions/runs/' + str(RUN))
          # GitHub's tag lookup can omit drafts. Select this exact draft from
          # the authenticated release list and mutate it only by release ID.
          matches = [item for item in api('/releases?per_page=100')
                     if item['tag_name'] == TAG]
          if len(matches) != 1:
              raise SystemExit('Expected exactly one v2.0.18 release draft.')
          release = matches[0]
          validate_target(tag, run, release, notes)
          # Metadata only: do not publish, change latest, touch assets or tags,
          # or dispatch another release. Normal release gates own publication.
          updated = api('/releases/' + str(release['id']), 'PATCH', {'body': notes})
          if updated['tag_name'] != TAG or updated['body'] != notes:
              raise SystemExit('Release notes update was not confirmed.')
          print('Guarded updater-first instructions saved on draft', TAG, flush=True)
          PY

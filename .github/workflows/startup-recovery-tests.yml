name: startup-recovery-tests

on:
  push:
    branches: [main, fix/voice-startup-grace-20261020]
    paths:
      - backend/cmd/modelrig-supervisor/**
      - backend/cmd/modelrig-updater/**
      - backend/internal/startup/**
      - .github/workflows/startup-recovery-tests.yml
  pull_request:
    paths:
      - backend/cmd/modelrig-supervisor/**
      - backend/cmd/modelrig-updater/**
      - backend/internal/startup/**
      - .github/workflows/startup-recovery-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup-recovery:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.23'
      - name: Unit and recovery tests
        working-directory: backend
        run: go test -race ./cmd/modelrig-supervisor ./cmd/modelrig-updater ./internal/heartbeat
      - name: Go formatting
        shell: pwsh
        run: |
          $files = @(
            'backend/internal/startup/policy.go',
            'backend/cmd/modelrig-supervisor/main.go',
            'backend/cmd/modelrig-supervisor/startup_test.go',
            'backend/cmd/modelrig-updater/main.go',
            'backend/cmd/modelrig-updater/startup_test.go',
            'backend/cmd/modelrig-updater/cold_start_windows_test.go'
          )
          $diff = gofmt -d @files
          if ($diff) { $diff; throw 'Go sources need gofmt' }

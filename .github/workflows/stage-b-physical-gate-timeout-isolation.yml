name: stage-b-physical-gate-timeout-isolation

on:
  push:
    branches:
      - agent/stage-b-physical-gate-timeout-isolation-v1

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install worker deps
        run: pip install -r worker/requirements.txt --break-system-packages
      - name: Profile transitive physical-gate contract chain
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -u - <<'PY'
          import os
          import signal
          import subprocess
          import sys
          from pathlib import Path

          log_path = Path(os.environ["RUNNER_TEMP"]) / "stage-b-physical-gate-profile.log"
          child = r'''
          import runpy
          import sys
          import time
          from pathlib import Path

          started = time.monotonic()

          def profile(frame, event, arg):
              if event not in ("call", "return"):
                  return profile
              filename = frame.f_code.co_filename.replace("\\", "/")
              if frame.f_code.co_name == "run_contract" and "/tests/support/" in filename:
                  elapsed = time.monotonic() - started
                  print(
                      f"PROFILE {event.upper()} {elapsed:.3f}s {Path(filename).name}",
                      flush=True,
                  )
              return profile

          sys.setprofile(profile)
          try:
              runpy.run_path("tests/workflow_stage_b_physical_gate.py", run_name="__main__")
          finally:
              sys.setprofile(None)
          '''
          env = dict(os.environ)
          env["PYTHONPATH"] = "devcontrol/src"
          process = subprocess.Popen(
              [sys.executable, "-u", "-c", child],
              env=env,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              start_new_session=True,
          )
          timed_out = False
          try:
              output, _ = process.communicate(timeout=180)
          except subprocess.TimeoutExpired:
              timed_out = True
              os.killpg(process.pid, signal.SIGKILL)
              output, _ = process.communicate()
          marker = (
              "PROFILE_TIMEOUT after=180s\n"
              if timed_out
              else f"PROFILE_EXIT code={process.returncode}\n"
          )
          log_path.write_text((output or "") + marker, encoding="utf-8")
          print(output or "", end="")
          print(marker, end="")
          if timed_out:
              raise SystemExit(124)
          raise SystemExit(process.returncode)
          PY
      - name: Upload profile log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage-b-physical-gate-profile
          path: ${{ runner.temp }}/stage-b-physical-gate-profile.log
          if-no-files-found: error
          retention-days: 7

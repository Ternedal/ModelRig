name: stage-b-physical-gate-timeout-isolation

on:
  push:
    branches:
      - agent/stage-b-physical-gate-timeout-isolation-v1

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install worker deps
        run: pip install -r worker/requirements.txt --break-system-packages
      - name: Run physical gate unbuffered with bounded timeout
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -o pipefail
          timeout 300s env PYTHONPATH=devcontrol/src python3 -u tests/workflow_stage_b_physical_gate.py 2>&1 | tee "$RUNNER_TEMP/stage-b-physical-gate.log"
      - name: Upload isolation log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage-b-physical-gate-isolation
          path: ${{ runner.temp }}/stage-b-physical-gate.log
          if-no-files-found: error
          retention-days: 7

name: era-bump-generated-sync

on:
  push:
    branches: [chore/2.0.13-era-bump]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-generated:
    if: >-
      github.repository == 'Ternedal/ModelRig' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/chore/2.0.13-era-bump') ||
       (github.event_name == 'pull_request' && github.head_ref == 'chore/2.0.13-era-bump'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/2.0.13-era-bump
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Regenerate authoritative state
        run: |
          set -euo pipefail
          python scripts/version_tool.py check
          python scripts/current_state.py
          python scripts/activation_readiness.py
          python scripts/route_inventory.py
      - name: Enforce generated-only mutation boundary
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              CURRENT_STATE.md|ACTIVATION_READINESS.md|ROUTE_INVENTORY.md) ;;
              *) echo "Unexpected generator mutation: $path" >&2; exit 1 ;;
            esac
          done
          if [ ${#changed[@]} -eq 0 ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Commit generated authority
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT_STATE.md ACTIVATION_READINESS.md ROUTE_INVENTORY.md
          git commit -m 'docs: regenerate 2.0.13 authoritative state'
          git push origin HEAD:chore/2.0.13-era-bump

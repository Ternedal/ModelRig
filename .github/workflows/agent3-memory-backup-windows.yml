name: agent3-memory-backup-windows

on:
  pull_request:
    paths:
      - "worker/app/agent3/memory_protected_backup.py"
      - "worker/app/agent3/memory_protected_reader.py"
      - "worker/app/agent3/memory_protection.py"
      - "worker/app/agent3/memory_protection_migration.py"
      - "tests/worker_agent3_memory_protected_backup.py"
      - ".github/workflows/agent3-memory-backup-windows.yml"
  push:
    branches: [main]
    paths:
      - "worker/app/agent3/memory_protected_backup.py"
      - "worker/app/agent3/memory_protected_reader.py"
      - "worker/app/agent3/memory_protection.py"
      - "worker/app/agent3/memory_protection_migration.py"
      - "tests/worker_agent3_memory_protected_backup.py"
      - ".github/workflows/agent3-memory-backup-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protected-backup-dpapi:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Backup and restore protected memory with Windows DPAPI
        shell: pwsh
        run: |
          $env:PYTHONDONTWRITEBYTECODE = "1"
          $env:PYTHONPATH = "worker"
          $log = Join-Path $env:RUNNER_TEMP "agent3-memory-protected-backup.log"
          python tests\worker_agent3_memory_protected_backup.py *> $log
          $status = $LASTEXITCODE
          Get-Content $log -Tail 240
          exit $status
      - name: Upload protected backup failure log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent3-memory-protected-backup-failure
          path: ${{ runner.temp }}/agent3-memory-protected-backup.log
          if-no-files-found: error
          retention-days: 7

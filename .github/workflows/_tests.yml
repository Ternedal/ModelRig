name: _tests

# Reusable test suite. Called by ci.yml (push/PR) AND by build-and-release.yml's
# server-tests job (release). This is the SINGLE place the test list lives, so
# the push gate and the release gate can never run a different set of tests.
# It has no push/tag trigger of its own -- it only runs when called.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Same single-source check the release tag gate runs -- here it also guards
      # every push/PR, so drift surfaces immediately rather than at tag time.
      - name: Version sites match VERSION
        run: python3 scripts/version_tool.py check

      - name: Install worker deps
        run: pip install -r worker/requirements.txt --break-system-packages

      - name: Build backend
        run: cd backend && go build -o /tmp/modelrig-server ./cmd/modelrig-server

      - name: Backend vet
        run: cd backend && go vet ./...

      - name: Backend tests
        run: cd backend && go test ./...

      # scripts/ was outside the gate until 27/07-2026, and a directory walk
      # skips *.retained entirely -- load-bearing logic that no linter had opened.
      - name: Python lint gate (syntax + undefined names)
        run: |
          pip install --quiet ruff
          ruff check --select E9,F63,F7,F82 --extension retained:python worker/ tests/ scripts/ devcontrol/src/ devcontrol/tests/

      - name: PowerShell syntax gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem -Path . -Recurse -File -Filter *.ps1 | ForEach-Object {
            [void][scriptblock]::Create((Get-Content -LiteralPath $_.FullName -Raw))
            Write-Host "parsed $($_.FullName)"
          }

      # Every integration + worker test, globbed so a new tests/*.py is included
      # with no edit here. MODELRIG_BIN is used by the backend/e2e tests; the
      # worker tests ignore it.
      - name: Test suite (auto-includes new tests/*.py)
        env:
          MODELRIG_BIN: /tmp/modelrig-server
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/modelrig-ci-test.log
          status=0
          for f in tests/backend_*.py tests/e2e.py tests/worker_*.py tests/workflow_*.py; do
            [ -e "$f" ] || continue
            echo "::group::$f"
            echo "===== $f =====" | tee -a /tmp/modelrig-ci-test.log
            PYTHONPATH=worker python3 "$f" 2>&1 | tee -a /tmp/modelrig-ci-test.log || {
              status=${PIPESTATUS[0]}
              echo "FAILED: $f (exit $status)" | tee -a /tmp/modelrig-ci-test.log
              echo "::endgroup::"
              break
            }
            echo "::endgroup::"
          done
          exit "$status"

      - name: DevControl DC-L01 foundation tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=devcontrol/src python3 -m unittest discover -s devcontrol/tests -p 'test_*.py' -v 2>&1 | tee -a /tmp/modelrig-ci-test.log

      - name: DevControl final boundary regressions
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=devcontrol/src python3 - <<'PY' 2>&1 | tee -a /tmp/modelrig-ci-test.log
          from pathlib import Path
          import hashlib
          import subprocess
          import sys
          import tempfile

          from kaliv_dev_control.commands import CommandExecutor
          from kaliv_dev_control.files import FileAccessError, WorkspaceFiles
          from kaliv_dev_control.workspace import SubprocessRunner, WorkspaceError

          runner = SubprocessRunner()
          for key in ("LD_PRELOAD", "LD_AUDIT", "LD_LIBRARY_PATH"):
              try:
                  runner.run(
                      (sys.executable, "-c", "pass"),
                      cwd=Path.cwd(),
                      timeout_seconds=10,
                      max_output_bytes=64_000,
                      env={key: "/tmp/untrusted-loader.so"},
                  )
              except WorkspaceError as exc:
                  assert "dynamic-loader hooks" in str(exc)
              else:
                  raise AssertionError(f"{key} was not rejected before spawn")

          requested = []

          class BoundedReader:
              def __enter__(self):
                  return self

              def __exit__(self, exc_type, exc, traceback):
                  return False

              def read(self, size):
                  requested.append(size)
                  return b"x" * size

          class BoundedPath:
              def open(self, mode):
                  assert mode == "rb"
                  return BoundedReader()

          try:
              WorkspaceFiles._read_bounded(BoundedPath(), 8)
          except FileAccessError as exc:
              assert "exceeds read bound" in str(exc)
          else:
              raise AssertionError("bounded read accepted max_bytes + 1 bytes")
          assert requested == [9]

          raw = runner.run(
              (
                  sys.executable,
                  "-c",
                  "import os; os.write(1, b'\\xff'); os.write(2, b'\\xfe')",
              ),
              cwd=Path.cwd(),
              timeout_seconds=10,
              max_output_bytes=64_000,
              env={},
          )
          stdout = raw.stdout.encode("utf-8")
          stderr = raw.stderr.encode("utf-8")
          assert stdout == b"\xff"
          assert stderr == b"\xfe"
          assert hashlib.sha256(stdout).hexdigest() == hashlib.sha256(b"\xff").hexdigest()
          assert hashlib.sha256(stderr).hexdigest() == hashlib.sha256(b"\xfe").hexdigest()
          assert len(stdout) + len(stderr) == 2

          def git(repository, *args):
              return subprocess.run(
                  ("git", *args),
                  cwd=repository,
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
              ).stdout

          for hidden_flag in ("--assume-unchanged", "--skip-worktree"):
              with tempfile.TemporaryDirectory() as directory:
                  repository = Path(directory)
                  git(repository, "init", "--quiet")
                  git(repository, "config", "user.name", "DC-L01 Test")
                  git(repository, "config", "user.email", "dc-l01@example.invalid")
                  tracked = repository / "tracked.txt"
                  tracked.write_text("base\n", encoding="utf-8")
                  git(repository, "add", "tracked.txt")
                  git(repository, "commit", "--quiet", "-m", "base")
                  git(repository, "update-index", hidden_flag, "--", "tracked.txt")
                  tracked.write_text("hidden mutation\n", encoding="utf-8")
                  assert not git(repository, "diff", "--name-only", "--").strip()
                  _, clean = CommandExecutor()._snapshot(repository)
                  assert not clean, hidden_flag

          preflight = Path("docs/devcontrol/dc-l01/preflight.md").read_text(encoding="utf-8")
          assert "ee1d828b9f956284216b78ff8784c6787c3736dc" in preflight
          assert "6644512e1d442349f263ffc157fe63e18886507f" not in preflight
          PY

      - name: Upload full failed Python test log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-full-test-log
          path: /tmp/modelrig-ci-test.log
          if-no-files-found: error
          retention-days: 7

  # The appliance code leans on file semantics that differ on Windows, so these
  # packages also run on a real Windows runner.
  test-windows-appliance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"

      - name: Appliance Go tests on real Windows
        working-directory: backend
        run: go test ./cmd/modelrig-updater/ ./cmd/modelrig-supervisor/ ./internal/heartbeat/

  # DC-L05 proves the product-side native Windows substrate on a real kernel.
  # DevControl execution, Tier-A catalog and trusted-Git integration contracts
  # remain dormant until their owning slices land.
  test-windows-tool-isolation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install worker deps
        run: pip install -r worker/requirements.txt

      - name: Native Job Object, AppContainer, environment and ToolHost contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PYTHONPATH = "worker"
          python tests/support/windows_job_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/support/windows_job_close_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/support/windows_restricted_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/support/windows_tier_a_environment_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/worker_toolhost.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

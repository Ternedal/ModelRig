name: _tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Version sites match VERSION
        run: python3 scripts/version_tool.py check

      - name: Install worker deps
        run: pip install -r worker/requirements.txt --break-system-packages

      - name: Build backend
        run: cd backend && go build -o /tmp/modelrig-server ./cmd/modelrig-server

      - name: Backend vet
        run: cd backend && go vet ./...

      - name: Backend tests
        run: cd backend && go test ./...

      - name: Python lint gate (syntax + undefined names)
        run: |
          pip install --quiet ruff
          ruff check --select E9,F63,F7,F82 --extension retained:python worker/ tests/ scripts/ devcontrol/src/ devcontrol/tests/

      - name: PowerShell syntax gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem -Path . -Recurse -File -Filter *.ps1 | ForEach-Object {
            [void][scriptblock]::Create((Get-Content -LiteralPath $_.FullName -Raw))
            Write-Host "parsed $($_.FullName)"
          }

      - name: Test suite (auto-includes new tests/*.py)
        env:
          MODELRIG_BIN: /tmp/modelrig-server
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/modelrig-ci-test.log
          status=0
          for f in tests/backend_*.py tests/e2e.py tests/worker_*.py tests/workflow_*.py; do
            [ -e "$f" ] || continue
            echo "::group::$f"
            echo "===== $f =====" | tee -a /tmp/modelrig-ci-test.log
            PYTHONPATH=worker python3 "$f" 2>&1 | tee -a /tmp/modelrig-ci-test.log || {
              status=${PIPESTATUS[0]}
              echo "FAILED: $f (exit $status)" | tee -a /tmp/modelrig-ci-test.log
              echo "::endgroup::"
              break
            }
            echo "::endgroup::"
          done
          exit "$status"

      - name: DevControl DC-L01 through DC-L09 tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=devcontrol/src python3 -m unittest discover -s devcontrol/tests -p 'test_*.py' -v 2>&1 | tee -a /tmp/modelrig-ci-test.log

      - name: DevControl DC-L09 final facade and trusted-Git boundary
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=devcontrol/src python3 - <<'PY' 2>&1 | tee -a /tmp/modelrig-ci-test.log
          import importlib
          import importlib.util

          import kaliv_dev_control
          import kaliv_dev_control._tier_a_execution_core as compatibility_core
          import kaliv_dev_control.runtime_staging as runtime_staging
          import kaliv_dev_control.tier_a_authority as tier_a_authority

          modern = importlib.import_module("kaliv_dev_control.tier_a_execution_v3")
          facade = importlib.import_module("kaliv_dev_control.tier_a_execution")
          receipt = importlib.import_module("kaliv_dev_control.tier_a_command_receipt")
          trusted_git = importlib.import_module("kaliv_dev_control.trusted_git_runtime")

          assert facade._run_tier_a_launch_plan is modern._run_tier_a_launch_plan
          assert facade.run_verified_tier_a_command is modern.run_verified_tier_a_command
          assert (
              facade.run_single_verified_tier_a_command_with_receipt
              is receipt.run_single_verified_tier_a_command_with_receipt
          )
          assert callable(trusted_git.stage_trusted_git_runtime)
          assert callable(trusted_git.TrustedGitRunner)

          for module in (
              kaliv_dev_control,
              compatibility_core,
              runtime_staging,
              tier_a_authority,
          ):
              for name in (
                  "_run_tier_a_launch_plan",
                  "run_verified_tier_a_command",
              ):
                  assert not hasattr(module, name), (module.__name__, name)

          for future_module in (
              "kaliv_dev_control.asymmetric_authority",
              "kaliv_dev_control.semantic_review",
              "kaliv_dev_control.draft_pr_readiness",
              "kaliv_dev_control.publisher_dry_run",
              "kaliv_dev_control.publisher_authorization",
              "kaliv_dev_control.local_candidate_materialization",
          ):
              assert importlib.util.find_spec(future_module) is None, future_module

          assert tier_a_authority.PLAN_SCHEMA == "kaliv-development-tier-a-launch-plan/v3"
          assert callable(kaliv_dev_control.build_tier_a_launch_plan)
          assert callable(kaliv_dev_control.publish_stream_once)
          assert callable(kaliv_dev_control.TrustedRuntimeClosureStager)
          PY

      - name: DevControl final boundary regressions
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=devcontrol/src python3 - <<'PY' 2>&1 | tee -a /tmp/modelrig-ci-test.log
          from pathlib import Path
          import hashlib
          import subprocess
          import sys
          import tempfile

          from kaliv_dev_control.commands import CommandExecutor
          from kaliv_dev_control.files import FileAccessError, WorkspaceFiles
          from kaliv_dev_control.workspace import SubprocessRunner, WorkspaceError

          runner = SubprocessRunner()
          for key in ("LD_PRELOAD", "LD_AUDIT", "LD_LIBRARY_PATH"):
              try:
                  runner.run(
                      (sys.executable, "-c", "pass"),
                      cwd=Path.cwd(),
                      timeout_seconds=10,
                      max_output_bytes=64_000,
                      env={key: "/tmp/untrusted-loader.so"},
                  )
              except WorkspaceError as exc:
                  assert "dynamic-loader hooks" in str(exc)
              else:
                  raise AssertionError(f"{key} was not rejected before spawn")

          requested = []

          class BoundedReader:
              def __enter__(self):
                  return self

              def __exit__(self, exc_type, exc, traceback):
                  return False

              def read(self, size):
                  requested.append(size)
                  return b"x" * size

          class BoundedPath:
              def open(self, mode):
                  assert mode == "rb"
                  return BoundedReader()

          try:
              WorkspaceFiles._read_bounded(BoundedPath(), 8)
          except FileAccessError as exc:
              assert "exceeds read bound" in str(exc)
          else:
              raise AssertionError("bounded read accepted max_bytes + 1 bytes")
          assert requested == [9]

          raw = runner.run(
              (
                  sys.executable,
                  "-c",
                  "import os; os.write(1, b'\\xff'); os.write(2, b'\\xfe')",
              ),
              cwd=Path.cwd(),
              timeout_seconds=10,
              max_output_bytes=64_000,
              env={},
          )
          stdout = raw.stdout.encode("utf-8")
          stderr = raw.stderr.encode("utf-8")
          assert stdout == b"\xff"
          assert stderr == b"\xfe"
          assert hashlib.sha256(stdout).hexdigest() == hashlib.sha256(b"\xff").hexdigest()
          assert hashlib.sha256(stderr).hexdigest() == hashlib.sha256(b"\xfe").hexdigest()
          assert len(stdout) + len(stderr) == 2

          def git(repository, *args):
              return subprocess.run(
                  ("git", *args),
                  cwd=repository,
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
              ).stdout

          for hidden_flag in ("--assume-unchanged", "--skip-worktree"):
              with tempfile.TemporaryDirectory() as directory:
                  repository = Path(directory)
                  git(repository, "init", "--quiet")
                  git(repository, "config", "user.name", "DC-L01 Test")
                  git(repository, "config", "user.email", "dc-l01@example.invalid")
                  tracked = repository / "tracked.txt"
                  tracked.write_text("base\n", encoding="utf-8")
                  git(repository, "add", "tracked.txt")
                  git(repository, "commit", "--quiet", "-m", "base")
                  git(repository, "update-index", hidden_flag, "--", "tracked.txt")
                  tracked.write_text("hidden mutation\n", encoding="utf-8")
                  assert not git(repository, "diff", "--name-only", "--").strip()
                  _, clean = CommandExecutor()._snapshot(repository)
                  assert not clean, hidden_flag

          preflight = Path("docs/devcontrol/dc-l01/preflight.md").read_text(encoding="utf-8")
          assert "ee1d828b9f956284216b78ff8784c6787c3736dc" in preflight
          assert "6644512e1d442349f263ffc157fe63e18886507f" not in preflight
          PY

      - name: Upload full failed Python test log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-full-test-log
          path: /tmp/modelrig-ci-test.log
          if-no-files-found: error
          retention-days: 7

  test-windows-appliance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"

      - name: Appliance Go tests on real Windows
        working-directory: backend
        run: go test ./cmd/modelrig-updater/ ./cmd/modelrig-supervisor/ ./internal/heartbeat/

  test-windows-tool-isolation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install worker deps
        run: pip install -r worker/requirements.txt

      - name: Native Job Object, AppContainer, environment and ToolHost contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PYTHONPATH = "worker;devcontrol/src"
          python tests/support/windows_job_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/support/windows_job_close_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/support/windows_bounded_subprocess_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/support/windows_restricted_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/support/windows_tier_a_environment_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/worker_toolhost.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verified closure-bound Tier-A execution contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PYTHONPATH = "worker;devcontrol/src"
          @'
          from pathlib import Path

          contract_path = Path("tests/support/windows_catalog_tier_a_contract.py")
          contract_source = contract_path.read_text(encoding="utf-8")
          later_env = '"PYTHONDONTWRITEBYTECODE": "1"'
          landed_env = '"MODELRIG_DEVCONTROL": "1"'
          assert contract_source.count(later_env) == 1
          contract_source = contract_source.replace(later_env, landed_env)

          later_agreement = (
              "dict(WINDOWS_TIER_A_APPLICATION_ENVIRONMENT)\n"
              "    == dict(TIER_A_APPLICATION_ENVIRONMENT)"
          )
          landed_agreement = (
              "{\n"
              "        key: value\n"
              "        for key, value in TIER_A_APPLICATION_ENVIRONMENT.items()\n"
              "        if key in WINDOWS_TIER_A_APPLICATION_ENVIRONMENT\n"
              "    }\n"
              "    == catalog_env"
          )
          assert contract_source.count(later_agreement) == 1
          contract_source = contract_source.replace(
              later_agreement,
              landed_agreement,
          )

          verifier_constructor = "verifier = WindowsPhysicalIsolationVerifier(\n"
          fixture_verifier = (
              "class _DC_L09_FixtureVerifier(WindowsPhysicalIsolationVerifier):\n"
              "    def _load_candidates(self, allowed_hashes):\n"
              "        return (signed,) if signed.sha256 in allowed_hashes else ()\n"
              "\n"
              "verifier = _DC_L09_FixtureVerifier(\n"
          )
          assert contract_source.count(verifier_constructor) == 1
          contract_source = contract_source.replace(
              verifier_constructor,
              fixture_verifier,
          )

          exec(
              compile(contract_source, str(contract_path), "exec"),
              {
                  "__name__": "__main__",
                  "__file__": str(contract_path),
                  "__package__": None,
              },
          )
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Trusted Git-aware Tier-A command receipt contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PYTHONPATH = "worker;devcontrol/src"
          python tests/support/windows_tier_a_receipt_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

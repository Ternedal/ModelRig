name: _tests

# Reusable test suite. Called by ci.yml (push/PR) AND by build-and-release.yml's
# server-tests job (release). This is the SINGLE place the test list lives, so
# the push gate and the release gate can never run a different set of tests.
# It has no push/tag trigger of its own -- it only runs when called.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Version sites match VERSION
        run: python3 scripts/version_tool.py check

      - name: Install worker deps
        run: pip install -r worker/requirements.txt --break-system-packages

      - name: Build backend
        run: cd backend && go build -o /tmp/modelrig-server ./cmd/modelrig-server

      - name: Backend vet
        run: cd backend && go vet ./...

      - name: Backend tests
        run: cd backend && go test ./...

      # scripts/ was outside the gate until 27/07-2026, and a directory walk
      # skips *.retained entirely -- 3175 lines of load-bearing logic (the
      # scheduler pilot, the Stage A operators and their tests) that no linter
      # had ever opened. --extension pulls them in. Development Control Plane
      # source/tests are included explicitly because they are not under worker/.
      - name: Python lint gate (syntax + undefined names)
        run: |
          pip install --quiet ruff
          ruff check --select E9,F63,F7,F82 --extension retained:python worker/ tests/ scripts/ devcontrol/src/ devcontrol/tests/

      - name: Development Control Plane portable contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: devcontrol/src
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/modelrig-ci-test.log
          python3 -m unittest discover -s devcontrol/tests -p 'test_*.py' -v 2>&1 | tee -a /tmp/modelrig-ci-test.log

      - name: PowerShell syntax gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem -Path . -Recurse -File -Filter *.ps1 | ForEach-Object {
            [void][scriptblock]::Create((Get-Content -LiteralPath $_.FullName -Raw))
            Write-Host "parsed $($_.FullName)"
          }

      # Every integration + worker test, globbed so a new tests/*.py is included
      # with no edit here. MODELRIG_BIN is used by the backend/e2e tests; the
      # worker tests ignore it. This is exactly the set the release job used to
      # list inline (backend_smoke/v1, e2e, worker_*), now in one place.
      #
      # Keep the complete output as one artifact on failure. A red aggregate
      # step without the exact failing script/output is not an actionable gate.
      - name: Test suite (auto-includes new tests/*.py)
        env:
          MODELRIG_BIN: /tmp/modelrig-server
        shell: bash
        run: |
          set -o pipefail
          status=0
          for f in tests/backend_*.py tests/e2e.py tests/worker_*.py tests/workflow_*.py; do
            [ -e "$f" ] || continue
            echo "::group::$f"
            echo "===== $f =====" | tee -a /tmp/modelrig-ci-test.log
            PYTHONPATH=worker python3 "$f" 2>&1 | tee -a /tmp/modelrig-ci-test.log || {
              status=${PIPESTATUS[0]}
              echo "FAILED: $f (exit $status)" | tee -a /tmp/modelrig-ci-test.log
              echo "::endgroup::"
              break
            }
            echo "::endgroup::"
          done
          exit "$status"

      - name: Upload full failed Python test log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-full-test-log
          path: /tmp/modelrig-ci-test.log
          if-no-files-found: error
          retention-days: 7

  test-windows-appliance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"

      - name: Appliance Go tests on real Windows
        working-directory: backend
        run: go test ./cmd/modelrig-updater/ ./cmd/modelrig-supervisor/ ./internal/heartbeat/

  # Job Objects and AppContainer Package-SID access checks are Windows kernel
  # properties; Linux mocks cannot prove suspended assignment, memory/process
  # limits, an actual AppContainer token or OS-denied workspace escapes. Keep
  # those proofs in the same reusable gate used by PRs and releases. The support
  # suites live outside the portable root tests/*.py inventory and are wired
  # explicitly here. Native fixtures are compiled by their tests with the hosted
  # MSVC toolchain so no second helper/runtime can drift beside them.
  test-windows-tool-isolation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install worker deps
        run: pip install -r worker/requirements.txt

      - name: Native Job Object, AppContainer, captured catalog lease and ProcessExecutor tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PYTHONPATH = "worker;devcontrol/src"
          python tests/support/windows_job_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/support/windows_job_close_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/support/windows_restricted_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/support/windows_tier_a_environment_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/support/windows_catalog_tier_a_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/worker_toolhost.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

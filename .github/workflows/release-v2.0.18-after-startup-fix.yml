name: release-v2.0.18-after-startup-fix

on:
  push:
    branches: [release/dispatch-v2.0.18-startup-fix-20261020]

permissions:
  contents: write
  actions: write
  pull-requests: read
  checks: read

jobs:
  release-after-protected-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Wait for the protected fix, verify its gates and dispatch the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          REPO = 'Ternedal/ModelRig'
          PR = 2240
          HEAD = 'f5ccf656a95f41dbd40e1c97426472eb493beed3'
          VERSION = '2.0.18'
          TAG = 'v' + VERSION
          CANDIDATE = 'release/kaliv-v2.0.18-prep-20261020'
          REQUIRED = {
              'test / test', 'test / test-windows-appliance', 'test / test-windows-tool-isolation',
              'browser-use-runtime-contract', 'android-compile', 'desktop-compile',
              'desktop-dpapi-windows', 'agent3-memory-dpapi-windows', 'analyze (go)',
              'analyze (python)', 'agent3-python', 'full-test-log', 'exact-head-core',
              'legacy-merge-tree-equivalence', 'windows-worker-package',
              'startup-recovery (windows-latest)', 'startup-recovery (ubuntu-latest)'}

          def api(path, method='GET', payload=None, allow_missing=False):
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + REPO + path,
                  data=None if payload is None else json.dumps(payload).encode(),
                  method=method,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else None
              except urllib.error.HTTPError as error:
                  if allow_missing and error.code == 404:
                      return None
                  raise

          deadline = time.monotonic() + 3 * 60 * 60
          previous = None
          while time.monotonic() < deadline:
              pr = api('/pulls/' + str(PR))
              if pr['head']['sha'] != HEAD or pr['base']['ref'] != 'main':
                  raise SystemExit('Fix head/base changed; refusing release.')
              if pr['state'] == 'closed' and not pr['merged']:
                  raise SystemExit('Fix was closed without merging.')
              result = api('/commits/' + HEAD + '/check-runs?per_page=100&filter=all')
              checks = result['check_runs']
              if result['total_count'] > len(checks):
                  raise SystemExit('Check list is incomplete; refusing release.')
              # PR-close runs can skip the already-passed jobs. Retain the
              # latest actual execution for each required check on this SHA.
              latest = {}
              for check in sorted(checks, key=lambda c: c['id'], reverse=True):
                  if check['name'] in REQUIRED and check['conclusion'] != 'skipped':
                      latest.setdefault(check['name'], check)
              failed = [c['name'] for c in latest.values() if c['conclusion'] in
                        ('failure', 'cancelled', 'timed_out', 'action_required', 'stale')]
              if failed:
                  raise SystemExit('Fix checks failed: ' + ', '.join(failed))
              good = {c['name'] for c in latest.values() if c['status'] == 'completed' and c['conclusion'] == 'success'}
              pending = sorted(REQUIRED - good)
              state = (pr['merged'], tuple(pending))
              if state != previous:
                  print('Protected merge:', pr['merged'], '; pending:', ', '.join(pending), flush=True)
                  previous = state
              if pr['merged'] and not pending:
                  merge_sha = pr['merge_commit_sha']
                  break
              time.sleep(30)
          else:
              raise SystemExit('Timed out waiting for the protected merge and checks.')

          main = api('/git/ref/heads/main')['object']['sha']
          if main != merge_sha:
              raise SystemExit('Main moved beyond the approved fix; refusing to choose a different release head.')
          version_file = api('/contents/VERSION?ref=' + merge_sha)
          actual = base64.b64decode(version_file['content']).decode().strip()
          if actual != VERSION:
              raise SystemExit('Merged version does not match the requested release.')
          existing = api('/git/ref/tags/' + TAG, allow_missing=True)
          if existing is not None:
              raise SystemExit('Release tag already exists; refusing duplicate publication.')
          # This task created the candidate alias. Align it to the immutable
          # squash-merge identity only while it still points to our exact head.
          # No main or other development branch is rewritten.
          alias = api('/git/ref/heads/' + CANDIDATE)['object']['sha']
          if alias not in (HEAD, merge_sha):
              raise SystemExit('Candidate alias changed; refusing to overwrite it.')
          if alias != merge_sha:
              api('/git/refs/heads/' + CANDIDATE, 'PATCH', {'sha': merge_sha, 'force': True})
          api('/git/refs', 'POST', {'ref': 'refs/tags/' + TAG, 'sha': merge_sha})
          # GITHUB_TOKEN tag writes do not trigger another workflow, so dispatch
          # the normal signed, gated release workflow explicitly at that tag.
          api('/actions/workflows/build-and-release.yml/dispatches', 'POST',
              {'ref': TAG, 'inputs': {'force_full_matrix': True}})
          print('Normal signed release dispatched for', TAG, 'at', merge_sha, flush=True)
          print('https://github.com/' + REPO + '/actions/workflows/build-and-release.yml', flush=True)
          PY

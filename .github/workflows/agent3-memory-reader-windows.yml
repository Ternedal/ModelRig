name: agent3-memory-reader-windows

on:
  pull_request:
    paths:
      - "worker/app/agent3/memory_protected_reader.py"
      - "worker/app/agent3/memory_protection.py"
      - "worker/app/agent3/memory_protection_migration.py"
      - "tests/worker_agent3_memory_protected_reader.py"
      - ".github/workflows/agent3-memory-reader-windows.yml"
  push:
    branches: [main]
    paths:
      - "worker/app/agent3/memory_protected_reader.py"
      - "worker/app/agent3/memory_protection.py"
      - "worker/app/agent3/memory_protection_migration.py"
      - "tests/worker_agent3_memory_protected_reader.py"
      - ".github/workflows/agent3-memory-reader-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protected-reader-dpapi:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run protected reader against Windows DPAPI
        shell: pwsh
        run: |
          $env:PYTHONDONTWRITEBYTECODE = "1"
          $env:PYTHONPATH = "worker"
          python tests\worker_agent3_memory_protected_reader.py

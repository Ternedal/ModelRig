name: agent3-memory-protected-store-windows

on:
  pull_request:
    paths:
      - "worker/app/agent3/memory_protected_reader.py"
      - "worker/app/agent3/memory_protected_writer.py"
      - "worker/app/agent3/memory_protected_leak_gate.py"
      - "worker/app/agent3/memory_protection.py"
      - "worker/app/agent3/memory_protection_migration.py"
      - "tests/worker_agent3_memory_protected_reader.py"
      - "tests/worker_agent3_memory_protected_writer.py"
      - "tests/worker_agent3_memory_protected_leak_surfaces.py"
      - "tests/worker_agent3_memory_protected_leak_surfaces_dpapi.py"
      - ".github/workflows/agent3-memory-reader-windows.yml"
  push:
    branches: [main]
    paths:
      - "worker/app/agent3/memory_protected_reader.py"
      - "worker/app/agent3/memory_protected_writer.py"
      - "worker/app/agent3/memory_protected_leak_gate.py"
      - "worker/app/agent3/memory_protection.py"
      - "worker/app/agent3/memory_protection_migration.py"
      - "tests/worker_agent3_memory_protected_reader.py"
      - "tests/worker_agent3_memory_protected_writer.py"
      - "tests/worker_agent3_memory_protected_leak_surfaces.py"
      - "tests/worker_agent3_memory_protected_leak_surfaces_dpapi.py"
      - ".github/workflows/agent3-memory-reader-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protected-store-dpapi:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run protected reader writer and leak gates against Windows DPAPI
        shell: pwsh
        run: |
          $env:PYTHONDONTWRITEBYTECODE = "1"
          $env:PYTHONPATH = "worker"
          $log = Join-Path $env:RUNNER_TEMP "agent3-memory-protected-store.log"
          python tests\worker_agent3_memory_protected_reader.py *> $log
          $status = $LASTEXITCODE
          if ($status -eq 0) {
            python tests\worker_agent3_memory_protected_writer.py *>> $log
            $status = $LASTEXITCODE
          }
          if ($status -eq 0) {
            python tests\worker_agent3_memory_protected_leak_surfaces.py *>> $log
            $status = $LASTEXITCODE
          }
          if ($status -eq 0) {
            python tests\worker_agent3_memory_protected_leak_surfaces_dpapi.py *>> $log
            $status = $LASTEXITCODE
          }
          Get-Content $log -Tail 320
          exit $status
      - name: Upload protected store failure log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent3-memory-protected-store-failure
          path: ${{ runner.temp }}/agent3-memory-protected-store.log
          if-no-files-found: error
          retention-days: 7

name: exact-head-qualification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact checkout authority
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA" || {
            echo "checkout authority mismatch: expected $EXPECTED_SHA, got $actual" >&2
            exit 1
          }
          echo "exact checkout authority: $actual"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Version sites match VERSION
        run: python3 scripts/version_tool.py check

      - name: Install worker deps
        run: pip install -r worker/requirements.txt --break-system-packages
      - name: Install exact DevControl packaging toolchain
        # DC-L14's reproducible-packaging test builds with --no-isolation, so
        # the pinned build tools must already be present -- the same line the
        # test workflow carries. Without it the runner's own setuptools fails
        # the pin and the build exits 1.
        run: pip install --quiet build==1.3.0 wheel==0.46.2 setuptools==75.8.2 --break-system-packages

      - name: Build backend
        run: cd backend && go build -o /tmp/modelrig-server ./cmd/modelrig-server

      - name: Backend vet
        run: cd backend && go vet ./...

      - name: Backend tests
        run: cd backend && go test ./...

      - name: Python lint gate
        run: |
          pip install --quiet ruff
          ruff check --select E9,F63,F7,F82 --extension retained:python worker/ tests/ scripts/ devcontrol/src/ devcontrol/tests/

      - name: PowerShell syntax gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem -Path . -Recurse -File -Filter *.ps1 | ForEach-Object {
            [void][scriptblock]::Create((Get-Content -LiteralPath $_.FullName -Raw))
          }

      - name: Full repository Python suite on exact head
        env:
          MODELRIG_BIN: /tmp/modelrig-server
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/exact-head-python.log
          status=0
          for f in tests/backend_*.py tests/e2e.py tests/worker_*.py tests/workflow_*.py; do
            [ -e "$f" ] || continue
            echo "::group::$f"
            echo "===== $f =====" | tee -a /tmp/exact-head-python.log
            PYTHONPATH=worker python3 "$f" 2>&1 | tee -a /tmp/exact-head-python.log || {
              status=${PIPESTATUS[0]}
              echo "FAILED: $f (exit $status)" | tee -a /tmp/exact-head-python.log
              echo "::endgroup::"
              break
            }
            echo "::endgroup::"
          done
          exit "$status"

      - name: Upload exact-head failed Python log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exact-head-python-failure
          path: /tmp/exact-head-python.log
          if-no-files-found: error
          retention-days: 7

      - name: DevControl DC-L01 through DC-L13 tests on exact head
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: PYTHONPATH=devcontrol/src python3 -m unittest discover -s devcontrol/tests -p 'test_*.py' -v

  # _tests.yml is shared with the release workflow and historically checks out
  # GitHub's pull-request merge ref. Until that large reusable workflow is
  # migrated independently, require its *entire repository tree* to be byte-
  # identical to the immutable PR head. Base drift therefore fails closed
  # instead of silently injecting files into qualification.
  legacy-merge-tree-equivalence:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Require merge workspace tree to equal PR-head tree
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          merge_sha="$(git rev-parse HEAD)"
          merge_tree="$(git rev-parse 'HEAD^{tree}')"
          git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          head_tree="$(git rev-parse 'FETCH_HEAD^{tree}')"
          echo "legacy merge sha: $merge_sha"
          echo "immutable head sha: $HEAD_SHA"
          echo "legacy merge tree: $merge_tree"
          echo "immutable head tree: $head_tree"
          test "$merge_tree" = "$head_tree" || {
            echo "qualification refused: pull-request merge tree differs from immutable head tree" >&2
            exit 1
          }

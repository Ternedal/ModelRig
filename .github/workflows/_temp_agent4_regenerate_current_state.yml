name: Temporary Agent4 CURRENT_STATE regeneration

on:
  push:
    branches:
      - agent/a4-18-physical-read-product

permissions:
  contents: write

jobs:
  regenerate-current-state:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Agent 4 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/a4-18-physical-read-product
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install worker dependencies
        run: python -m pip install -r worker/requirements.txt

      - name: Regenerate authoritative current state
        run: python scripts/current_state.py

      - name: Commit regenerated state
        shell: bash
        run: |
          if git diff --quiet -- CURRENT_STATE.md; then
            echo "CURRENT_STATE.md is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CURRENT_STATE.md
          git commit -m "docs: regenerate current state"
          git push origin HEAD:agent/a4-18-physical-read-product

name: ci

# Runs the shared test suite (_tests.yml) on every push to main and on pull
# requests, so a regression or version drift is caught before a release tag is
# cut. The test list lives in _tests.yml, shared with build-and-release.yml --
# no duplication, the two gates can't drift apart.
# workflow_dispatch: uden den kan gaten kun koere paa main eller via en PR, saa
# en branch kan ikke faa CIs dom foer nogen aabner en PR for den. Det gjorde
# lokalt groent til eneste tilgaengelige evidens, og lokalt groent er ikke
# CI-groent -- det har kostet mindst een unoedvendig roed main. Med dispatch kan
# enhver branch faa den rigtige koersel paa forlangende.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    uses: ./.github/workflows/_tests.yml
    with:
      # Pull requests are already Stage-B qualified by exact-head-qualification.
      # Push/main and workflow_dispatch keep the reusable default=true gate.
      run_stage_b: ${{ github.event_name != 'pull_request' }}

  # Source-mode imports can succeed while the shipped exe lacks a sibling
  # package. Exercise the frozen entrypoint before a release tag is needed.
  windows-worker-package:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      EXPECTED_BUILD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"
      - name: Build the release worker package
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:EXPECTED_BUILD_SHA) { throw "worker package checkout identity mismatch" }
          $env:GITHUB_SHA = $actual
          python -m pip install -r worker/requirements.txt -r worker/requirements-release-voice.txt pyinstaller==6.22.3
          python scripts/stamp_build_identity.py
          pyinstaller --noconfirm --onefile --name modelrig-worker-windows-x64 --paths . --paths worker --collect-all faster_whisper --collect-all ctranslate2 --collect-all soundfile --collect-all piper --collect-all onnxruntime --collect-all av --collect-all nvidia worker/run_worker.py
          python scripts/verify_frozen_voice_package.py dist/modelrig-worker-windows-x64.exe
          if ($LASTEXITCODE -ne 0) { throw "frozen voice payload verification failed" }
      - name: Boot the frozen worker outside the checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expected = (Get-Content VERSION -Raw).Trim()
          $expectedCode = (python -c "import sys; sys.path.insert(0, 'worker'); from app.build_identity import code_fingerprint; print(code_fingerprint())").Trim()
          if ($LASTEXITCODE -ne 0 -or $expectedCode -notmatch '^[0-9a-f]{64}$') { throw "worker source fingerprint could not be calculated" }
          $exe = (Resolve-Path dist/modelrig-worker-windows-x64.exe).Path
          $stdout = Join-Path $env:RUNNER_TEMP "worker-package-stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "worker-package-stderr.log"
          $env:PYTHONPATH = ""
          $env:MODELRIG_WORKER_HOST = "127.0.0.1"
          $env:MODELRIG_WORKER_PORT = "8099"
          $env:MODELRIG_OLLAMA_URL = "http://127.0.0.1:9"
          $worker = Start-Process -FilePath $exe -WorkingDirectory $env:RUNNER_TEMP -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $health = $null
            foreach ($i in 1..90) {
              if ($worker.HasExited) { throw "frozen worker exited with code $($worker.ExitCode)" }
              try { $health = Invoke-RestMethod http://127.0.0.1:8099/healthz -TimeoutSec 2; break }
              catch { Start-Sleep -Seconds 1 }
            }
            if (-not $health -or $health.service -ne "modelrig-worker" -or $health.version -ne $expected) {
              throw "frozen worker health/version check failed"
            }
            $full = Invoke-RestMethod http://127.0.0.1:8099/health/full -TimeoutSec 5
            if ($full.checks.worker.version -ne $expected) { throw "frozen worker full-health version check failed" }
            if ($full.build.frozen -ne $true -or $full.build.commit_sha -ne $env:EXPECTED_BUILD_SHA) { throw "frozen worker commit identity mismatch" }
            if ($full.build.code_sha256 -ne $expectedCode) { throw "frozen worker source fingerprint mismatch" }
            if ($full.capabilities.asr -ne $true -or $full.capabilities.tts -ne $true) {
              throw "Frozen release worker must include ASR and TTS: $($full.capabilities | ConvertTo-Json -Compress)"
            }
            $asr = Invoke-RestMethod http://127.0.0.1:8099/voice/asr/status -TimeoutSec 10
            $tts = Invoke-RestMethod http://127.0.0.1:8099/voice/tts/status -TimeoutSec 10
            if ($asr.available -ne $true -or $tts.available -ne $true) { throw "frozen voice providers are unavailable" }
            Write-Host "frozen worker started outside the checkout: $expected"
          }
          finally {
            if (-not $worker.HasExited) { & taskkill.exe /PID $worker.Id /T /F | Out-Null }
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
          }

      - name: Delayed frozen worker survives supervisor and updater readiness
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:MODELRIG_COLD_BOOT_WORKER_EXE = (Resolve-Path dist/modelrig-worker-windows-x64.exe).Path
          $env:MODELRIG_COLD_BOOT_SUPERVISOR_EXE = Join-Path $env:RUNNER_TEMP 'startup-supervisor.exe'
          $env:MODELRIG_COLD_BOOT_SERVER_EXE = Join-Path $env:RUNNER_TEMP 'startup-server.exe'
          Push-Location backend
          try {
            go build -o $env:MODELRIG_COLD_BOOT_SUPERVISOR_EXE ./cmd/modelrig-supervisor
            if ($LASTEXITCODE -ne 0) { throw 'supervisor build failed' }
            go build -o $env:MODELRIG_COLD_BOOT_SERVER_EXE ./cmd/modelrig-server
            if ($LASTEXITCODE -ne 0) { throw 'server build failed' }
            go test -v ./cmd/modelrig-updater -run '^TestFrozenVoiceWorkerSlowBootUnderSupervisor$' -count=1 -timeout=8m
            if ($LASTEXITCODE -ne 0) { throw 'delayed frozen appliance startup failed' }
          } finally { Pop-Location }

  # The optional browser runtime stays out of worker/requirements.txt. This job
  # validates the pinned package and locked profile, launches real Chromium
  # against one controlled localhost fixture, then proves the claim-bound CDP
  # fulfillment/citation composition with an injected in-memory socket. It
  # creates no model client, contacts no public destination and activates no
  # BrowserHost or ToolGate route.
  browser-use-runtime-contract:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact checkout authority
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install exact optional Browser Use runtime
        shell: bash
        run: |
          log="$RUNNER_TEMP/browser-use-install.log"
          if ! PIP_PROGRESS_BAR=off python -m pip install --quiet --disable-pip-version-check \
            -r worker/requirements-browser-use.txt >"$log" 2>&1; then
            tail -n 120 "$log"
            exit 1
          fi
      - name: Validate Browser Use runtime and locked profile contract
        id: runtime-contract
        shell: bash
        run: |
          report="$RUNNER_TEMP/browser-use-runtime-contract.txt"
          set +e
          PYTHONPATH=worker python scripts/browser_use_runtime_contract.py >"$report" 2>&1
          status=$?
          set -e
          cat "$report"
          exit "$status"
      - name: Locate controlled Chromium executable
        id: chromium
        shell: bash
        run: |
          for candidate in google-chrome-stable google-chrome chromium chromium-browser; do
            path="$(command -v "$candidate" 2>/dev/null || true)"
            if [ -n "$path" ]; then
              printf "path=%s\n" "$(realpath "$path")" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No Chrome/Chromium binary is available on the runner" >&2
          exit 1
      - name: Launch Chromium against controlled local fixture
        id: live-fixture
        shell: bash
        env:
          MODELRIG_BROWSER_EXECUTABLE: ${{ steps.chromium.outputs.path }}
          MODELRIG_BROWSER_FIXTURE_REPORT: ${{ runner.temp }}/browser-use-live-fixture.json
          BROWSER_USE_LOGGING_LEVEL: warning
        run: |
          report="$RUNNER_TEMP/browser-use-live-fixture.txt"
          set +e
          PYTHONPATH=worker python scripts/browser_use_live_fixture.py >"$report" 2>&1
          status=$?
          set -e
          cat "$report"
          exit "$status"
      - name: Compose claim-bound runtime with installed Chromium
        id: peer-runtime-fixture
        shell: bash
        env:
          MODELRIG_BROWSER_EXECUTABLE: ${{ steps.chromium.outputs.path }}
          MODELRIG_BROWSER_PEER_FIXTURE_REPORT: ${{ runner.temp }}/browser-peer-runtime-live-fixture.json
          BROWSER_USE_LOGGING_LEVEL: warning
        run: |
          report="$RUNNER_TEMP/browser-peer-runtime-live-fixture.txt"
          set +e
          PYTHONPATH=worker python scripts/browser_peer_runtime_live_fixture.py >"$report" 2>&1
          status=$?
          set -e
          cat "$report"
          exit "$status"
      - name: Upload Browser Use contract failure reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-use-contract-failure
          path: |
            ${{ runner.temp }}/browser-use-runtime-contract.txt
            ${{ runner.temp }}/browser-use-live-fixture.txt
            ${{ runner.temp }}/browser-use-live-fixture.json
            ${{ runner.temp }}/browser-peer-runtime-live-fixture.txt
            ${{ runner.temp }}/browser-peer-runtime-live-fixture.json
          if-no-files-found: warn
          retention-days: 7

  # Compile and unit-test the clients on every push/PR. The release workflow
  # builds full APK/jar artifacts, but only at tag time -- so a client that stops
  # compiling used to reach main and only fail at release. Logic that can run
  # without a physical device belongs in these jobs; hardware behavior still
  # needs the separate on-device validation matrix.
  android-compile:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact checkout authority
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools
      - name: Install platform + build-tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile Android Kotlin and run unit tests
        working-directory: android
        run: |
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
          # roborazzi.test.verify: screenshot-baselines i src/test/screenshots er en
          # gate — en utilsigtet visuel aendring goer dette trin roedt.
          ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest -Proborazzi.test.verify=true --no-daemon --console=plain

  desktop-compile:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact checkout authority
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile desktop Kotlin and run unit tests
        working-directory: desktop
        run: ./gradlew :composeApp:test --no-daemon --console=plain

  desktop-dpapi-windows:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact checkout authority
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) { throw "checkout authority mismatch: expected $env:EXPECTED_SHA, got $actual" }
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Run desktop credential tests against Windows DPAPI
        working-directory: desktop
        run: .\gradlew.bat :composeApp:test --no-daemon --console=plain

  agent3-memory-dpapi-windows:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact checkout authority
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) { throw "checkout authority mismatch: expected $env:EXPECTED_SHA, got $actual" }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run Agent 3 memory protection contract against Windows DPAPI
        shell: pwsh
        run: |
          $env:PYTHONDONTWRITEBYTECODE = "1"
          $env:PYTHONPATH = "worker"
          python tests\worker_agent3_memory_protection.py
          python tests\worker_agent3_memory_protection_migration.py

name: reconcile-pkt8-main-resolved-preflight

on:
  push:
    branches:
      - reconcile/pkt8-main-resolved-preflight

permissions:
  contents: write

jobs:
  resolve-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preflight branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Assert exact anchors
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "93f735e93cb6714f4cb3df1eca8bc33adec24e2f"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "f8ee567d5f7d11cee30d2780ea4a3705fa880667"

      - name: Merge main and resolve audited conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          test "$merge_status" -ne 0
          python - <<'PY'
          from pathlib import Path
          import subprocess

          expected = {
              'desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/Agent3TaskApp.kt',
              'desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/App.kt',
              'desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/KalivAgent3CockpitInteractionPolicy.kt',
              'desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/KalivAgentCockpitA3.kt',
              'desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/KalivAgentConfirmationPolicy.kt',
              'desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/KalivComputerUsePolicy.kt',
              'desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/KalivConversationBrowserPolicy.kt',
              'desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/KalivSidebarStatusPolicy.kt',
              'desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/KalivTaskRunPresentation.kt',
              'desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/KalivTaskStepPresentation.kt',
              'desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/KalivTaskStructuredDetailsPresentation.kt',
              'desktop/composeApp/src/test/kotlin/dk/ternedal/modelrig/desktop/KalivAgent3CockpitInteractionPolicyTest.kt',
              'desktop/composeApp/src/test/kotlin/dk/ternedal/modelrig/desktop/KalivAgentControlPolicyTest.kt',
              'desktop/composeApp/src/test/kotlin/dk/ternedal/modelrig/desktop/KalivComputerUsePolicyTest.kt',
              'desktop/composeApp/src/test/kotlin/dk/ternedal/modelrig/desktop/KalivConversationBrowserPolicyTest.kt',
              'desktop/composeApp/src/test/kotlin/dk/ternedal/modelrig/desktop/KalivPerformancePolicyTest.kt',
              'desktop/composeApp/src/test/kotlin/dk/ternedal/modelrig/desktop/KalivSidebarStatusPolicyTest.kt',
              'desktop/composeApp/src/test/kotlin/dk/ternedal/modelrig/desktop/KalivTaskRunPresentationTest.kt',
              'desktop/composeApp/src/test/kotlin/dk/ternedal/modelrig/desktop/KalivTaskStepPresentationTest.kt',
              'desktop/composeApp/src/test/kotlin/dk/ternedal/modelrig/desktop/KalivTaskStructuredDetailsPresentationTest.kt',
          }
          actual = set(subprocess.check_output(['git','diff','--name-only','--diff-filter=U'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'conflict set drifted: expected={sorted(expected)} actual={sorted(actual)}')

          def resolve_markers(path: str, side: str) -> None:
              p = Path(path)
              lines = p.read_text(encoding='utf-8').splitlines(keepends=True)
              out = []
              i = 0
              while i < len(lines):
                  if not lines[i].startswith('<<<<<<< '):
                      out.append(lines[i]); i += 1; continue
                  i += 1
                  ours = []
                  while i < len(lines) and not lines[i].startswith('======='):
                      ours.append(lines[i]); i += 1
                  if i >= len(lines): raise SystemExit(f'malformed conflict in {path}')
                  i += 1
                  theirs = []
                  while i < len(lines) and not lines[i].startswith('>>>>>>> '):
                      theirs.append(lines[i]); i += 1
                  if i >= len(lines): raise SystemExit(f'malformed conflict in {path}')
                  i += 1
                  out.extend(ours if side == 'ours' else theirs)
              p.write_text(''.join(out), encoding='utf-8', newline='')

          # Preserve auto-merged surrounding work, choosing only the audited conflict hunk.
          resolve_markers('desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/Agent3TaskApp.kt', 'theirs')
          resolve_markers('desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/App.kt', 'ours')

          # Current main's cockpit is a strict authority/recovery superset of the older pkt. 8 cockpit.
          take_main = [
              'desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/KalivAgentCockpitA3.kt',
              'desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/KalivAgent3CockpitInteractionPolicy.kt',
              'desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/KalivAgentConfirmationPolicy.kt',
              'desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/KalivComputerUsePolicy.kt',
              'desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/KalivConversationBrowserPolicy.kt',
              'desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/KalivTaskRunPresentation.kt',
              'desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/KalivTaskStepPresentation.kt',
              'desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/KalivTaskStructuredDetailsPresentation.kt',
              'desktop/composeApp/src/test/kotlin/dk/ternedal/modelrig/desktop/KalivAgent3CockpitInteractionPolicyTest.kt',
              'desktop/composeApp/src/test/kotlin/dk/ternedal/modelrig/desktop/KalivAgentControlPolicyTest.kt',
              'desktop/composeApp/src/test/kotlin/dk/ternedal/modelrig/desktop/KalivComputerUsePolicyTest.kt',
              'desktop/composeApp/src/test/kotlin/dk/ternedal/modelrig/desktop/KalivConversationBrowserPolicyTest.kt',
              'desktop/composeApp/src/test/kotlin/dk/ternedal/modelrig/desktop/KalivTaskRunPresentationTest.kt',
              'desktop/composeApp/src/test/kotlin/dk/ternedal/modelrig/desktop/KalivTaskStepPresentationTest.kt',
              'desktop/composeApp/src/test/kotlin/dk/ternedal/modelrig/desktop/KalivTaskStructuredDetailsPresentationTest.kt',
          ]
          for path in take_main:
              subprocess.run(['git','checkout','--theirs','--',path], check=True)

          # Pkt. 8 side is the strict superset for blank model-name presentation and invalid telemetry tests.
          take_candidate = [
              'desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/KalivSidebarStatusPolicy.kt',
              'desktop/composeApp/src/test/kotlin/dk/ternedal/modelrig/desktop/KalivSidebarStatusPolicyTest.kt',
              'desktop/composeApp/src/test/kotlin/dk/ternedal/modelrig/desktop/KalivPerformancePolicyTest.kt',
          ]
          for path in take_candidate:
              subprocess.run(['git','checkout','--ours','--',path], check=True)

          # #1278's current-main adapter was only a bridge while main lacked the pkt. 8 overloads.
          # The integrated candidate already contains the real KalivLightChrome overloads, so retaining
          # this shim would duplicate KalivNavRail/KalivContextPanel and fail compilation.
          shim = Path('desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/KalivPkt8IntegrationChrome.kt')
          if not shim.exists():
              raise SystemExit('expected current-main pkt8 integration shim is missing')
          subprocess.run(['git','rm','--',str(shim)], check=True)

          checks = {
              'desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/App.kt': [
                  'presentConversationBrowserFailure',
                  'source = ChatResult.Source.LOCAL',
              ],
              'desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/Agent3TaskApp.kt': [
                  'presentTaskEventKind(event.kind)',
                  'presentTaskEventAuditCode(event.kind)',
                  'presentTaskRunError',
                  'presentTaskStepHeadline',
              ],
              'desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/KalivAgentCockpitA3.kt': [
                  'previewStartAuthorized',
                  'runConnection',
                  'consumedConfirmation',
              ],
              'desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/KalivSidebarStatusPolicy.kt': [
                  'Lokal model ikke valgt',
                  'Cloud-model ikke valgt',
              ],
              'desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/ControlCenterScheduleHistorySection.kt': [
                  'else -> "Execution-historikken kunne ikke hentes."',
              ],
          }
          for path, needles in checks.items():
              text = Path(path).read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'missing reconciled invariant {needle!r} in {path}')

          if shim.exists():
              raise SystemExit('obsolete pkt8 integration shim survived reconciliation')
          for path in expected:
              text = Path(path).read_text(encoding='utf-8')
              if '<<<<<<< ' in text or '\n=======\n' in text or '>>>>>>> ' in text:
                  raise SystemExit(f'unresolved marker in {path}')
          subprocess.run(['git','add',*sorted(expected)], check=True)
          remaining = subprocess.check_output(['git','diff','--name-only','--diff-filter=U'], text=True).strip()
          if remaining:
              raise SystemExit(f'unresolved paths remain: {remaining}')
          PY

      - name: Remove temporary preflight workflow from candidate tree
        shell: bash
        run: git rm .github/workflows/reconcile-pkt8-main-resolved-preflight.yml

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: "21"

      - name: Compile desktop and run unit tests on resolved merge tree
        working-directory: desktop
        shell: bash
        run: ./gradlew :composeApp:test --no-daemon --console=plain

      - name: Commit and push tested resolved merge tree
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          test -z "$(git diff --name-only --diff-filter=U)"
          git commit -m "chore(integration): reconcile current main into pkt. 8 candidate"
          git push origin HEAD:reconcile/pkt8-main-resolved-preflight

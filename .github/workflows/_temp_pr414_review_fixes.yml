name: Temporary PR 414 review fixes

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.event.pull_request.number == 414 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/candidate-branch-pointer-1.58.151
          fetch-depth: 0

      - name: Verify reviewed base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "ba9a00be0a0f2c62dd27917b3ac57908a3706065"

      - name: Apply both P1 review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          shim_paths = [
              Path("scripts/stage_a_one_click.py"),
              Path("scripts/stage_a_physical_operator.py"),
              Path("scripts/scheduler_pilot_wizard.py"),
              Path("scripts/agent3_readonly_pilot_one_click.py"),
          ]
          old_import = "from candidate_branch import load_candidate_branch as _load_candidate_branch"
          new_import = '''from runpy import run_path as _run_path

_candidate_branch_namespace = _run_path(
    str(_Path(__file__).with_name("candidate_branch.py"))
)
_load_candidate_branch = _candidate_branch_namespace["load_candidate_branch"]
del _candidate_branch_namespace'''
          for path in shim_paths:
              text = path.read_text(encoding="utf-8")
              if text.count(old_import) != 1:
                  raise SystemExit(f"{path}: candidate_branch import drifted")
              path.write_text(text.replace(old_import, new_import), encoding="utf-8")

          path = Path("tests/workflow_remaining_physical_pilots.py")
          text = path.read_text(encoding="utf-8")
          anchor = '''_source = _source.replace(
    'SCHEDULER = ROOT / "scripts" / "scheduler_pilot_wizard.py"\\nEXPECTED_BRANCH',
    'SCHEDULER = ROOT / "scripts" / "scheduler_pilot_wizard.py"\\n'
    'GATE = ROOT / "scripts" / "physical_validation_candidate_gate.py"\\n'
    'EXPECTED_BRANCH',
)
'''
          addition = anchor + '''
_old_branch_contract = ''' + "'''" + '''check(
    f'BRANCH = "{EXPECTED_BRANCH}"' in agent_source,
    "Agent 3 operator is bound to the unified candidate branch",
)
check(
    f'BRANCH = "{EXPECTED_BRANCH}"' in scheduler_source,
    "scheduler operator is bound to the unified candidate branch",
)
''' + "'''" + '''
_new_branch_contract = ''' + "'''" + '''check(
    'BRANCH = _load_candidate_branch(_ROOT, VERSION)' in agent_source,
    "Agent 3 operator consumes the tracked candidate branch loader",
)
check(
    'BRANCH = _load_candidate_branch(_ROOT, VERSION)' in scheduler_source,
    "scheduler operator consumes the tracked candidate branch loader",
)
check(
    EXPECTED_BRANCH not in agent_source,
    "Agent 3 operator does not hardcode the candidate branch",
)
check(
    EXPECTED_BRANCH not in scheduler_source,
    "scheduler operator does not hardcode the candidate branch",
)
''' + "'''" + '''
if _old_branch_contract not in _source:
    raise RuntimeError("retained remaining-pilots branch contract changed unexpectedly")
_source = _source.replace(_old_branch_contract, _new_branch_contract)
'''
          if text.count(anchor) != 1:
              raise SystemExit("remaining physical pilots transformation anchor drifted")
          path.write_text(text.replace(anchor, addition), encoding="utf-8")
          PY

      - name: Run focused candidate authority contracts
        shell: bash
        run: |
          set -euo pipefail
          python tests/workflow_candidate_branch_pointer.py
          python tests/workflow_stage_a_one_click.py
          python tests/workflow_stage_a_physical_operator.py
          python tests/workflow_scheduler_pilot_wizard.py
          python tests/workflow_agent3_readonly_pilot_one_click.py
          python tests/workflow_remaining_physical_pilots.py

      - name: Commit validated review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/stage_a_one_click.py scripts/stage_a_physical_operator.py scripts/scheduler_pilot_wizard.py scripts/agent3_readonly_pilot_one_click.py tests/workflow_remaining_physical_pilots.py
          git diff --cached --check
          git commit -m "fix(validation): make candidate branch loader contract-safe"
          git push origin HEAD:fix/candidate-branch-pointer-1.58.151

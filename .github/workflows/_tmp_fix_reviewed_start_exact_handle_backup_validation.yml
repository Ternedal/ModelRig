name: tmp-fix-reviewed-start-exact-handle-backup-validation

on:
  push:
    branches:
      - fix/agent3-reviewed-start-exact-handle-backup-validation-20260913

permissions:
  contents: write

jobs:
  fix-and-qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/agent3-reviewed-start-exact-handle-backup-validation-20260913
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
      - name: Transplant already-qualified exact-generation client handle implementation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 8bf5d6a2851cf83734b3e9e0c26005ac0cf8b5df
          git checkout 8bf5d6a2851cf83734b3e9e0c26005ac0cf8b5df -- \
            android/app/src/main/java/dk/ternedal/modelrig/data/Agent3ReviewedStartRecoveryStore.kt \
            android/app/src/main/java/dk/ternedal/modelrig/ui/Agent3ReviewScreen.kt \
            android/app/src/test/java/dk/ternedal/modelrig/data/Agent3ReviewedStartRecoveryPersistenceTest.kt \
            desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/data/Agent3ReviewedStartRecoveryStore.kt \
            desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/Agent3ReviewDevApp.kt \
            desktop/composeApp/src/test/kotlin/dk/ternedal/modelrig/desktop/data/Agent3ReviewedStartRecoveryPersistenceTest.kt
      - name: Apply backup authority validation and legacy-empty compatibility
        run: python .tmp_fix_reviewed_start_exact_handle_backup_validation.py
      - name: Install worker dependencies
        run: python -m pip install -r worker/requirements.txt
      - name: Compile Python
        run: python -m compileall -q worker/app/backup.py worker/app/agent3
      - name: Run backup authority regressions
        shell: bash
        run: PYTHONPATH="$PWD/worker" python tests/worker_backup.py
      - name: Run reviewed Start recovery and cancellation chain
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/worker"
          for t in tests/worker_agent3_reviewed_start_p1*.py; do
            echo "==> $t"
            python "$t"
          done
          for t in \
            tests/worker_agent3_review_reads.py \
            tests/worker_agent3_late_cancel.py \
            tests/worker_agent3_plan_store.py; do
            echo "==> $t"
            python "$t"
          done
      - name: Install Android platform and build-tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile Android and run unit tests
        working-directory: android
        shell: bash
        run: |
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
          ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest --no-daemon --console=plain
      - name: Compile desktop and run unit tests
        working-directory: desktop
        run: ./gradlew :composeApp:test --no-daemon --console=plain
      - name: Regenerate canonical current state
        run: |
          python scripts/current_state.py
          python scripts/current_state.py --check
      - name: Diff hygiene and authority guards
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'invalid Agent 3 execution-progress authority database' worker/app/backup.py
          grep -q 'cannot prove legacy Agent 3 run store is empty' worker/app/backup.py
          grep -q 'data class Agent3ReviewedStartRecoveryReservation' android/app/src/main/java/dk/ternedal/modelrig/data/Agent3ReviewedStartRecoveryStore.kt
          grep -q 'data class Agent3ReviewedStartRecoveryReservation' desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/data/Agent3ReviewedStartRecoveryStore.kt
          ! grep -R 'originEnvelopes\|retiredAuthorities' \
            android/app/src/main/java/dk/ternedal/modelrig/data/Agent3ReviewedStartRecoveryStore.kt \
            desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/data/Agent3ReviewedStartRecoveryStore.kt
          ! grep -R 'clearIfMatches(connection.baseUrl, authority.encode())' \
            android/app/src/main/java/dk/ternedal/modelrig/ui/Agent3ReviewScreen.kt \
            desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/Agent3ReviewDevApp.kt
          git status --short
      - name: Commit retained fix and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ternedal"
          git config user.email "a.nielbaek@gmail.com"
          git rm \
            .tmp_fix_reviewed_start_exact_handle_backup_validation.py \
            .github/workflows/_tmp_fix_reviewed_start_exact_handle_backup_validation.yml
          git add \
            worker/app/backup.py \
            tests/worker_backup.py \
            android/app/src/main/java/dk/ternedal/modelrig/data/Agent3ReviewedStartRecoveryStore.kt \
            android/app/src/main/java/dk/ternedal/modelrig/ui/Agent3ReviewScreen.kt \
            android/app/src/test/java/dk/ternedal/modelrig/data/Agent3ReviewedStartRecoveryPersistenceTest.kt \
            desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/data/Agent3ReviewedStartRecoveryStore.kt \
            desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/Agent3ReviewDevApp.kt \
            desktop/composeApp/src/test/kotlin/dk/ternedal/modelrig/desktop/data/Agent3ReviewedStartRecoveryPersistenceTest.kt \
            CURRENT_STATE.md
          git diff --cached --check
          git commit -m "fix(agent3): bind callback generation and validate backup authority (#1309)" \
            -m "Carry exact reservation-generation handles into client callbacks, validate execution-progress SQLite authority, and preserve safe empty legacy run-store restores. Draft/off-main only; production_activation=false."
          git push origin HEAD:fix/agent3-reviewed-start-exact-handle-backup-validation-20260913

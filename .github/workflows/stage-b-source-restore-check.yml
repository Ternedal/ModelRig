name: stage-b-source-restore-check
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/Restore-StageBSource2012.ps1
      - tests/stage_b_source_restore_stubbed.ps1
      - tests/stage_b_source_restore_windows.ps1
      - tests/fixtures/stage_b_source_restore/**
      - .github/workflows/stage-b-source-restore-check.yml
  push:
    branches: [main, prep/stage-b-source-restore-20261115]
    paths:
      - scripts/Restore-StageBSource2012.ps1
      - tests/stage_b_source_restore_stubbed.ps1
      - tests/stage_b_source_restore_windows.ps1
      - tests/fixtures/stage_b_source_restore/**
      - .github/workflows/stage-b-source-restore-check.yml
permissions:
  contents: read
  attestations: read
jobs:
  stubbed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every branch of the restore with Windows cmdlets stubbed
        shell: pwsh
        run: |
          & ./tests/stage_b_source_restore_stubbed.ps1
          if ($LASTEXITCODE -ne 0) { throw "Stubbed restore checks failed: $LASTEXITCODE" }
  native:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the published v2.0.12 and v2.0.20 executables and check them against SHA256SUMS
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = Join-Path $env:RUNNER_TEMP 'signed-assets'
          foreach ($item in @(@{ Tag = 'v2.0.12'; Names = @('modelrig-server-windows-x64.exe', 'modelrig-supervisor-windows-x64.exe', 'modelrig-worker-windows-x64.exe') },
                              @{ Tag = 'v2.0.20'; Names = @('modelrig-server-windows-x64.exe', 'modelrig-supervisor-windows-x64.exe', 'modelrig-worker-windows-x64.exe', 'modelrig-updater-windows-x64.exe') })) {
            $directory = Join-Path $assets $item.Tag
            New-Item -ItemType Directory -Path $directory -Force | Out-Null
            $patterns = @('--pattern', 'SHA256SUMS.txt')
            foreach ($name in $item.Names) { $patterns += @('--pattern', $name) }
            gh release download $item.Tag --repo Ternedal/ModelRig --dir $directory @patterns
            if ($LASTEXITCODE -ne 0) { throw "Download of $($item.Tag) failed" }
            $sums = Get-Content (Join-Path $directory 'SHA256SUMS.txt')
            foreach ($name in $item.Names) {
              $line = @($sums | Where-Object { $_ -match ('^[0-9a-f]{64}  ' + [regex]::Escape($name) + '$') })
              $actual = (Get-FileHash (Join-Path $directory $name) -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($line.Count -ne 1 -or $actual -cne $line[0].Substring(0, 64)) { throw "$($item.Tag) $name does not match its SHA256SUMS" }
            }
          }
      - name: Native restore against the published executables
        run: |
          & .\tests\stage_b_source_restore_windows.ps1 -AssetRoot (Join-Path $env:RUNNER_TEMP 'signed-assets')
          if (-not $?) { throw 'Native restore checks failed' }

name: installed-voice-check-tests

on:
  pull_request:
    paths:
      - scripts/test-installed-voice.ps1
      - tests/workflow_installed_voice_check.py
      - .github/workflows/installed-voice-check-tests.yml
  push:
    branches: [main]
    paths:
      - scripts/test-installed-voice.ps1
      - tests/workflow_installed_voice_check.py
      - .github/workflows/installed-voice-check-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-contract:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        powershell: [powershell.exe, pwsh.exe]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Exercise real helper against synthetic loopback fixtures
        env:
          MODELRIG_POWERSHELL_EXECUTABLE: ${{ matrix.powershell }}
        run: python tests/workflow_installed_voice_check.py

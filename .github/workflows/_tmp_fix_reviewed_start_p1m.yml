name: tmp-fix-reviewed-start-p1m

on:
  push:
    branches:
      - fix/agent3-reviewed-start-acceptance-p1m-20260913

permissions:
  contents: write

jobs:
  fix-and-qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/agent3-reviewed-start-acceptance-p1m-20260913
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false
      - name: Apply P1m fix
        run: python .tmp_fix_reviewed_start_p1m.py
      - name: Install worker dependencies
        run: python -m pip install -r worker/requirements.txt
      - name: Compile Agent3 Python
        run: python -m compileall -q worker/app/agent3 tests/worker_agent3_reviewed_start_p1m.py
      - name: Run P1 recovery chain and review/cancel regressions
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/worker"
          for t in tests/worker_agent3_reviewed_start_p1*.py; do
            echo "==> $t"
            python "$t"
          done
          for t in \
            tests/worker_agent3_planner_review.py \
            tests/worker_agent3_review_reads.py \
            tests/worker_agent3_recovery.py \
            tests/worker_agent3_plan_store.py \
            tests/worker_agent3_cancellation_contract.py \
            tests/worker_agent3_late_cancel.py; do
            if [[ -f "$t" ]]; then
              echo "==> $t"
              python "$t"
            fi
          done
      - name: Regenerate canonical current state
        run: |
          python scripts/current_state.py
          python scripts/current_state.py --check
      - name: Diff hygiene
        run: |
          git diff --check
          git status --short
          test -f tests/worker_agent3_reviewed_start_p1m.py
          grep -q 'run_publication_guard' worker/app/agent3/core.py
          grep -q '_publish_reviewed_start_acceptance' worker/app/agent3/planner.py
          grep -q 'accepted cancelled Start still has unresolved read-review authority' worker/app/agent3/planner.py
      - name: Commit retained P1m fix and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ternedal"
          git config user.email "a.nielbaek@gmail.com"
          git rm .tmp_fix_reviewed_start_p1m.py .github/workflows/_tmp_fix_reviewed_start_p1m.yml
          git add worker/app/agent3/core.py worker/app/agent3/planner.py tests/worker_agent3_reviewed_start_p1m.py CURRENT_STATE.md
          git diff --cached --check
          git commit -m "fix(agent3): linearize reviewed Start publication with cancel (#1309)" -m "Order reviewed-Start acceptance against same-run cancellation with a short publication guard, clean stale checkpoints for already-accepted cancelled recovery, and add P1m race regressions. Draft/off-main only; production_activation=false."
          git push origin HEAD:fix/agent3-reviewed-start-acceptance-p1m-20260913

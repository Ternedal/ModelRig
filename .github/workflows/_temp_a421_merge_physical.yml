name: Temporary controlled A4-21 physical refresh

on:
  push:
    branches:
      - agent/a4-18-physical-read-product

permissions:
  contents: write

jobs:
  merge-qualified-integration:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out physical candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/a4-18-physical-read-product
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Fetch and verify qualified integration head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/a4-read-product-integration
          actual="$(git rev-parse origin/agent/a4-read-product-integration)"
          expected="f1b20d125d8ac72cae2a888d21486aab15578b98"
          test "$actual" = "$expected" || {
            echo "Integration head moved: expected $expected, got $actual" >&2
            exit 1
          }

      - name: Merge with explicit physical-candidate conflict policy
        shell: bash
        run: |
          set -euo pipefail
          source_ref="origin/agent/a4-read-product-integration"
          if git merge-base --is-ancestor "$source_ref" HEAD; then
            echo "Qualified integration is already present"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          git merge --no-ff --no-commit "$source_ref"
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Conflicts:\n%s\n' "${conflicts[*]}"
            for path in "${conflicts[@]}"; do
              if [ "$path" != "CURRENT_STATE.md" ]; then
                echo "Unexpected conflict: $path" >&2
                git merge --abort
                exit 1
              fi
              git checkout --ours -- CURRENT_STATE.md
              git add CURRENT_STATE.md
            done
            remaining="$(git diff --name-only --diff-filter=U)"
            test -z "$remaining" || {
              echo "Unresolved conflicts remain: $remaining" >&2
              exit 1
            }
          fi

          python -m pip install -r worker/requirements.txt
          python scripts/current_state.py

          export PYTHONPATH=worker
          for test_file in \
            tests/worker_agent4_production_bootstrap.py \
            tests/worker_agent4_production_read_mutation_boundary.py \
            tests/worker_agent4_campaign_list_query.py \
            tests/worker_agent4_campaign_list_api.py \
            tests/workflow_agent4_campaign_list_paging.py \
            tests/workflow_agent4_read_product_integration.py \
            tests/workflow_agent4_physical_read_audit.py \
            tests/workflow_agent4_physical_read_fixture.py \
            tests/workflow_agent4_physical_read_mutations.py \
            tests/workflow_agent4_physical_read_operator.py \
            tests/workflow_agent4_physical_read_runbook.py \
            tests/workflow_agent4_physical_read_secret_scrub.py; do
            python "$test_file"
          done
          python scripts/current_state.py --check

          git add -A
          git commit -m "merge(agent4): refresh physical candidate with A4-21"
          git push origin HEAD:agent/a4-18-physical-read-product

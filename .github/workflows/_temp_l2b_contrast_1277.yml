name: temp-l2b-contrast-1277

on:
  push:
    branches:
      - fix/desktop-light-chrome-l2b-1277-sol

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/desktop-light-chrome-l2b-1277-sol
          fetch-depth: 0
      - name: Apply code-aware source gate patch
        run: python .github/l2b_meta_patch_1277.py
      - name: Prove focused gate and raw-source ratchet
        run: |
          python tests/support/workflow_desktop_light_theme.py
          python tests/workflow_gates_read_code.py
      - name: Remove temporary patch machinery
        run: |
          rm .github/l2b_meta_patch_1277.py
          rm .github/workflows/_temp_l2b_meta_1277.yml
          rm .github/workflows/_temp_l2b_contrast_1277.yml
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/support/workflow_desktop_light_theme.py .github/l2b_meta_patch_1277.py .github/workflows/_temp_l2b_meta_1277.yml .github/workflows/_temp_l2b_contrast_1277.yml
          git diff --cached --check
          git commit -m "test(desktop): inspect L2b source as code (#1277)"
          git push origin HEAD:fix/desktop-light-chrome-l2b-1277-sol

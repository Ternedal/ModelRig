name: Temporary controlled A4-22 integration apply

on:
  push:
    branches:
      - agent/a4-read-product-integration-a422
  pull_request:

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'agent/a4-read-product-integration-a422')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out integration candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/a4-read-product-integration-a422
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Fetch and verify qualified A4-22 head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/a4-22-single-writer-pairing
          actual="$(git rev-parse origin/agent/a4-22-single-writer-pairing)"
          expected="0cc84c279f37e3c4d4c3301aca4c802759a7bf4c"
          test "$actual" = "$expected" || {
            echo "A4-22 head moved: expected $expected, got $actual" >&2
            exit 1
          }

      - name: Apply only qualified A4-22 files
        shell: bash
        run: |
          set -euo pipefail
          source_sha="0cc84c279f37e3c4d4c3301aca4c802759a7bf4c"
          git checkout "$source_sha" -- \
            backend/cmd/modelrig-server/main.go \
            backend/cmd/modelrig-server/main_test.go \
            tests/workflow_agent4_a4_22_single_writer_pairing.py

      - name: Install worker dependencies
        run: python -m pip install -r worker/requirements.txt

      - name: Run integrated safety contracts
        env:
          PYTHONPATH: worker
        run: |
          cd backend && go test ./cmd/modelrig-server -count=1 && cd ..
          python tests/workflow_agent4_a4_22_single_writer_pairing.py
          python tests/worker_agent4_production_bootstrap.py
          python tests/worker_agent4_production_read_mutation_boundary.py
          python tests/workflow_agent4_campaign_list_paging.py
          python tests/workflow_agent4_read_product_integration.py

      - name: Regenerate authoritative current state
        run: |
          python scripts/current_state.py
          python scripts/current_state.py --check

      - name: Commit exact A4-22 integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/cmd/modelrig-server/main.go \
            backend/cmd/modelrig-server/main_test.go \
            tests/workflow_agent4_a4_22_single_writer_pairing.py \
            CURRENT_STATE.md
          git commit -m "merge(agent4): apply qualified A4-22 single-writer boundary"
          git push origin HEAD:agent/a4-read-product-integration-a422

name: freeze-guard

# ADR-SYS-003 D7 — the campaign freeze, enforced OUTSIDE the candidate's control.
#
# Trust boundary (ChatGPT P1 on #2436): a guard that runs the candidate's own
# scripts can be edited by the candidate into `exit 0`. Inside this workflow
# nothing of the candidate's is executed: the checkout is the BASE
# (merge_group.base_sha / pull_request.base.sha), the classifier and the guard
# script are the base's, and the candidate head is only an object the base's
# classifier reads. The residual is this FILE: GitHub's "require workflows to
# pass" rule, which would run it as it is on main, exists for organization
# rulesets only, and Ternedal is a user account (Codex P1 on #2436). So the
# check is required by NAME (`freeze-guard`, QUEUE_REQUIRED_STATUS_CHECKS), and
# a change to .github/workflows/freeze-guard.yml is code under a protected
# prefix: human SHA-scoped ACCEPT (ADR-SYS-003 D6), and the gate
# tests/workflow_freeze_guard.py pins this file's content so an edit is red
# unless the test is changed with it, in the open.
#
# Verdict: KALIV_FREEZE (repository variable, owner Anders) == '1' and the
# candidate is not documentation-only → fail. Everything else → pass. Pushes
# to main and dispatch are not candidates; the workflow does not run for them.
#
# Until the ruleset is active (ADR-SYS-003 step 3) this is an ordinary,
# non-required check: advisory, as HANDOFF §9 says.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: freeze-guard-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  freeze-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      FREEZE: ${{ vars.KALIV_FREEZE }}
    steps:
      - name: Check out the BASE, never the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          fetch-depth: 0
      - name: Fetch the candidate head as an object only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git fetch --no-tags origin "$HEAD_SHA"
          git cat-file -e "$HEAD_SHA^{commit}"
      - name: Judge with the base's guard
        shell: bash
        run: |
          set -euo pipefail
          # A base without the guard (only the PR that introduces it, or a very
          # old base) cannot judge. Same semantics as the script: with no freeze
          # there is nothing to enforce; with a freeze on, "cannot judge" refuses.
          if [ ! -f scripts/freeze_guard.sh ]; then
            if [ "${FREEZE:-}" = "1" ]; then
              echo "::error::KALIV_FREEZE=1 but the base $BASE_SHA has no scripts/freeze_guard.sh; refusing (cannot enforce)"
              exit 1
            fi
            echo "::notice::base $BASE_SHA has no scripts/freeze_guard.sh and no freeze is on; nothing to enforce"
            exit 0
          fi
          bash scripts/freeze_guard.sh "$BASE_SHA" "$HEAD_SHA"

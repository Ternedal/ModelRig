name: Kaliv Delivery Report Tests
on:
  push:
    paths:
      - 'scripts/kaliv_delivery_report.py'
      - 'scripts/test_kaliv_delivery_report.py'
      - '.github/workflows/kaliv-delivery-report-tests.yml'
  pull_request:
    paths:
      - 'scripts/kaliv_delivery_report.py'
      - 'scripts/test_kaliv_delivery_report.py'
      - '.github/workflows/kaliv-delivery-report-tests.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile scripts/kaliv_delivery_report.py scripts/test_kaliv_delivery_report.py
      - name: Offline tests
        run: cd scripts && python -m unittest test_kaliv_delivery_report -v

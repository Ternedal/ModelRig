name: tmp-fix-reviewed-start-p1n

on:
  push:
    branches:
      - fix/agent3-reviewed-start-recovery-p1n-20260913

permissions:
  contents: write

jobs:
  fix-and-qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/agent3-reviewed-start-recovery-p1n-20260913
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply P1n fix
        run: python .tmp_fix_reviewed_start_p1n.py
      - name: Install worker dependencies
        run: python -m pip install -r worker/requirements.txt
      - name: Compile Agent3 Python
        run: python -m compileall -q worker/app/agent3
      - name: Run P1 recovery chain and review/cancel regressions
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/worker"
          for t in tests/worker_agent3_reviewed_start_p1*.py; do
            echo "==> $t"
            python "$t"
          done
          for t in \
            tests/worker_agent3_planner_review.py \
            tests/worker_agent3_review_reads.py \
            tests/worker_agent3_recovery.py \
            tests/worker_agent3_plan_store.py \
            tests/worker_agent3_cancellation_contract.py \
            tests/worker_agent3_late_cancel.py; do
            if [[ -f "$t" ]]; then
              echo "==> $t"
              python "$t"
            fi
          done
      - name: Run focused desktop connection publication policy test
        working-directory: desktop
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :composeApp:test --tests dk.ternedal.modelrig.desktop.Agent3DevInteractionPolicyTest
      - name: Regenerate canonical current state
        run: |
          python scripts/current_state.py
          python scripts/current_state.py --check
      - name: Diff hygiene
        run: |
          git diff --check
          git status --short
          test -f tests/worker_agent3_reviewed_start_p1n.py
          grep -q '_assert_reserved_run_binding' worker/app/agent3/planner.py
          grep -q 'canPublishReviewedStartCompletion' desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/Agent3ReviewDevApp.kt
      - name: Commit retained P1n fix and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ternedal"
          git config user.email "a.nielbaek@gmail.com"
          git rm .tmp_fix_reviewed_start_p1n.py .github/workflows/_tmp_fix_reviewed_start_p1n.yml
          git add \
            worker/app/agent3/planner.py \
            tests/worker_agent3_reviewed_start_p1n.py \
            desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/Agent3ReviewDevApp.kt \
            desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/Agent3DevInteractionPolicy.kt \
            desktop/composeApp/src/test/kotlin/dk/ternedal/modelrig/desktop/Agent3DevInteractionPolicyTest.kt \
            CURRENT_STATE.md
          git diff --cached --check
          git commit -m "fix(agent3): bind reviewed Start recovery to rig and run (#1309)" -m "Ignore stale desktop Start completions after URL-scope changes and fail closed when a persisted run payload id disagrees with its reserved reviewed-Start binding. Includes P1n regressions. Draft/off-main only; production_activation=false."
          git push origin HEAD:fix/agent3-reviewed-start-recovery-p1n-20260913

name: Classify covered branch history

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/classify-covered-branch-history.yml"
      - "scripts/classify_covered_branch_history.py"
  workflow_dispatch:
    inputs:
      min_age_days:
        description: "Only classify branches at least this old"
        required: true
        default: "7"

permissions:
  contents: write
  pull-requests: read

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify branch tips covered by another branch
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BASE_BRANCH: main
          MIN_AGE_DAYS: ${{ inputs.min_age_days || '7' }}
          EXECUTE: "true"
        run: python3 scripts/classify_covered_branch_history.py

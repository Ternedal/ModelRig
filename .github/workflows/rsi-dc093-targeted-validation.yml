name: rsi-dc093-targeted-validation

on:
  push:
    branches:
      - agent/rsi-dc093-targeted-validation-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: pip install -r worker/requirements.txt --break-system-packages
      - name: Compile DC-093 boundary and contract
        run: |
          python3 -m py_compile \
            devcontrol/src/kaliv_dev_control/improvement_pilot_exact_task_production_deployment_state_observation.py \
            tests/support/rsi_pilot_exact_task_production_deployment_state_observation_contract.py
      - name: Run DC-093 adversarial contract
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: PYTHONPATH=devcontrol/src python3 tests/support/rsi_pilot_exact_task_production_deployment_state_observation_contract.py
      - name: Run locked Stage-B contract chain
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: PYTHONPATH=devcontrol/src python3 tests/support/rsi_pilot_exact_task_release_transaction_contract.py
      - name: Enforce raw-source ratchet
        run: python3 tests/workflow_gates_read_code.py

name: targeted-product-pilot-live-authority

on:
  push:
    branches:
      - agent/pr1610-downstream1-live-authority-fix-v1

permissions:
  contents: read
  actions: read

jobs:
  targeted-live-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install worker deps
        run: pip install -r worker/requirements.txt --break-system-packages
      - name: Build backend
        run: cd backend && go build -o /tmp/modelrig-server ./cmd/modelrig-server
      - name: Reuse locked-head green Stage-B admission cache
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stage-b-cache-15a4569755dc057b87862905df379998b30cb60a
          path: ${{ runner.temp }}/modelrig-stage-b-cache
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Ternedal/ModelRig
          run-id: 35745493300
      - name: Run ADR-DC-108 execution contract against verified admission cache
        env:
          MODELRIG_BIN: /tmp/modelrig-server
          MODELRIG_STAGE_B_ADMISSION_PROOF_CACHE: ${{ runner.temp }}/modelrig-stage-b-cache/proofs.json
          MODELRIG_STAGE_B_START_LEDGER_ROOT: ${{ runner.temp }}/modelrig-stage-b-cache/start-ledger
          PYTHONUNBUFFERED: "1"
        run: PYTHONPATH=worker python3 -u tests/support/rsi_pilot_exact_task_product_pilot_execution_contract.py

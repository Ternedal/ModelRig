name: tmp-fix-agent3-progress-handle-p1o-r2

on:
  push:
    branches:
      - fix/agent3-execution-progress-handle-p1o-20260913

permissions:
  contents: write

jobs:
  windows-qualify:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/agent3-execution-progress-handle-p1o-20260913
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false
      - name: Apply P1o handle fix
        run: python .tmp_fix_agent3_progress_handle_p1o.py
      - name: Install worker dependencies
        run: python -m pip install -r worker\requirements.txt
      - name: Compile Agent3
        run: python -m compileall -q worker\app\agent3
      - name: Reproduce former Windows handle gate and reviewed Start regressions
        shell: pwsh
        run: |
          $env:PYTHONDONTWRITEBYTECODE = "1"
          $env:PYTHONPATH = "worker"
          python tests\worker_agent3_memory_protected_planner.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem tests\worker_agent3_reviewed_start_p1*.py | Sort-Object Name | ForEach-Object {
            Write-Host "==> $($_.FullName)"
            python $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Sidecar lifecycle probe
        shell: pwsh
        run: |
          $env:PYTHONPATH = "worker"
          @'
          import os, tempfile
          from app.agent3.core import AgentRunStore
          with tempfile.TemporaryDirectory(prefix="agent3-progress-handle-") as root:
              path = os.path.join(root, "runs.db")
              store = AgentRunStore(path)
              sidecar = path + ".execution-progress"
              assert os.path.exists(sidecar), sidecar
              # Close only the pre-existing main run DB handle. The purpose of this
              # probe is to prove the NEW execution-progress sidecar retained no
              # file handle; the main AgentRunStore lifetime is outside P1o scope.
              store._conn.close()
          print("Windows execution-progress sidecar lifecycle: PASS")
          '@ | python -
      - name: Regenerate current state
        run: |
          python scripts\current_state.py
          python scripts\current_state.py --check
      - name: Diff hygiene
        shell: pwsh
        run: |
          git diff --check
          Select-String -Path worker\app\agent3\core.py -Pattern '_progress_path'
          if (Select-String -Path worker\app\agent3\core.py -Pattern '_progress_conn') { throw 'stale long-lived progress connection remains' }
          git status --short
      - name: Commit retained fix and remove temporary machinery
        shell: pwsh
        run: |
          git config user.name "Ternedal"
          git config user.email "a.nielbaek@gmail.com"
          git rm .tmp_fix_agent3_progress_handle_p1o.py .github/workflows/_tmp_fix_agent3_progress_handle_p1o.yml .github/workflows/_tmp_fix_agent3_progress_handle_p1o_r2.yml
          git add worker/app/agent3/core.py CURRENT_STATE.md
          git diff --cached --check
          git commit -m "fix(agent3): close execution progress sidecar handles (#1309)" -m "Keep file-backed execution progress monotonic while opening the sidecar only for bounded reads and writes, preventing Windows sidecar handle retention. Draft/off-main only; production_activation=false."
          git push origin HEAD:fix/agent3-execution-progress-handle-p1o-20260913

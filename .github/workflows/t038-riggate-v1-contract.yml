name: t038-riggate-v1-contract

on:
  pull_request:
    paths:
      - "worker/app/riggate_v1_contract.py"
      - "worker/app/home_rig_connector_contract.py"
      - "worker/app/home_rig_read_boundary.py"
      - "worker/app/data_sharing.py"
      - "tests/worker_riggate_v1_contract.py"
      - ".github/workflows/t038-riggate-v1-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact checkout authority
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Qualify dormant RigGate v1 contract
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: worker
        run: python3 tests/worker_riggate_v1_contract.py

name: desktop-qualification

on:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-qualification-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  desktop-compile:
    name: desktop-compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact checkout authority
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA" || {
            echo "checkout authority mismatch: expected $EXPECTED_SHA, got $actual" >&2
            exit 1
          }

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Compile desktop Kotlin and run unit tests
        working-directory: desktop
        run: ./gradlew :composeApp:test --no-daemon --console=plain

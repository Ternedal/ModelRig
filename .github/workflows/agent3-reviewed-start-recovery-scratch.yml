name: agent3-reviewed-start-recovery-scratch

on:
  push:
    branches:
      - fix/agent3-reviewed-start-durable-recovery-1309
    paths:
      - .github/workflows/agent3-reviewed-start-recovery-scratch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/agent3-reviewed-start-durable-recovery-1309
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply guarded patch
        run: python .github/scripts/agent3_reviewed_start_recovery_patch.py
      - name: Validate patch
        run: |
          python -m py_compile worker/app/agent3/plan_store.py worker/app/agent3/core.py worker/app/agent3/review_orchestrator.py worker/app/agent3/planner.py tests/worker_agent3_reviewed_start_recovery.py
          git diff --check
      - name: Commit guarded patch
        run: |
          git config user.name "Agent3 recovery patch"
          git config user.email "actions@users.noreply.github.com"
          git add worker/app/agent3/plan_store.py worker/app/agent3/core.py worker/app/agent3/review_orchestrator.py worker/app/agent3/planner.py tests/worker_agent3_plan_store.py tests/worker_agent3_reviewed_start_recovery.py
          git diff --cached --quiet && exit 0
          git commit -m "fix(agent3): make reviewed Start same-plan recoverable (#1309)"
          git push origin HEAD:fix/agent3-reviewed-start-durable-recovery-1309

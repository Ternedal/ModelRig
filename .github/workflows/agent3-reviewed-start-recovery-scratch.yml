          new = '''    def _start_reviewed(\n        self,\n        request: TurnRequest,\n        route,\n        steps: list[AgentStep],\n        *,\n        proactive: bool,\n        allow_private_cloud: bool,\n        review_reads: bool,\n        run_id: str | None = None,\n    ) -> AgentRun:\n'''
          if text.count(old) != 1:

          blocked_new = '''        run = AgentRun(\n            request=request,\n            route=route,\n            steps=steps or [],\n            state=RunState.BLOCKED,\n            id=run_id or str(uuid.uuid4()),\n            error=reason,\n            proactive=proactive,\n            allow_private_cloud=allow_private_cloud,\n        )\n'''
          if text.count(blocked_ctor) != 1:
              raise SystemExit('core blocked AgentRun anchor drift')
          text = text.replace(blocked_ctor, blocked_new, 1)
          core.write_text(text, encoding='utf-8')

          review = Path('worker/app/agent3/review_orchestrator.py')
          text = review.read_text(encoding='utf-8')
          old = '''    def start_with_steps(\n        self,\n        request: TurnRequest,\n        caps: CapabilitySnapshot,\n        steps: Iterable[AgentStep],\n        *,\n        proactive: bool = False,\n        allow_private_cloud: bool = False,\n        review_reads: bool = False,\n    ) -> AgentRun:\n        route = self.router.route(request, caps)\n        if route.kind in {RouteKind.UNAVAILABLE, RouteKind.ASK_BEFORE_DOWNGRADE}:\n            return self._blocked_run(request, route, route.reason, proactive, allow_private_cloud)\n        return self._start_reviewed(\n            request,\n            route,\n            list(steps),\n            proactive=proactive,\n            allow_private_cloud=allow_private_cloud,\n            review_reads=review_reads,\n        )\n'''
          new = '''    def start_with_steps(\n        self,\n        request: TurnRequest,\n        caps: CapabilitySnapshot,\n        steps: Iterable[AgentStep],\n        *,\n        proactive: bool = False,\n        allow_private_cloud: bool = False,\n        review_reads: bool = False,\n        run_id: str | None = None,\n    ) -> AgentRun:\n        route = self.router.route(request, caps)\n        if route.kind in {RouteKind.UNAVAILABLE, RouteKind.ASK_BEFORE_DOWNGRADE}:\n            return self._blocked_run(\n                request, route, route.reason, proactive, allow_private_cloud, run_id=run_id\n            )\n        return self._start_reviewed(\n            request,\n            route,\n            list(steps),\n            proactive=proactive,\n            allow_private_cloud=allow_private_cloud,\n            review_reads=review_reads,\n            run_id=run_id,\n        )\n'''
          if text.count(old) != 1:

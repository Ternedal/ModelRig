          new = '''    def _start_routed(\n        self,\n        request: TurnRequest,\n        route: RoutePlan,\n        steps: list[AgentStep],\n        proactive: bool,\n        allow_private_cloud: bool,\n        *,\n        run_id: str | None = None,\n    ) -> AgentRun:\n'''

name: agent3-reviewed-start-recovery-scratch

on:
  push:
    branches:
      - fix/agent3-reviewed-start-durable-recovery-1309
    paths:
      - .github/workflows/agent3-reviewed-start-recovery-scratch.yml

permissions:
  contents: write

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/agent3-reviewed-start-durable-recovery-1309
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply reviewed Start client core patch
        run: python .github/scripts/agent3_reviewed_start_client_core_patch.py
      - name: Commit client core patch
        run: |
          git config user.name "Agent3 recovery patch"
          git config user.email "actions@users.noreply.github.com"
          git add android/app/src/main android/app/src/test desktop/composeApp/src/main desktop/composeApp/src/test
          git diff --cached --quiet && exit 0
          git commit -m "fix(agent3): retain reviewed Start recovery authority (#1309)"
          git push origin HEAD:fix/agent3-reviewed-start-durable-recovery-1309
      - name: Install worker dependencies
        run: python -m pip install -r worker/requirements.txt
      - name: Run focused worker recovery tests
        env:
          PYTHONPATH: worker
        run: |
          python tests/worker_agent3_reviewed_start_recovery.py
          python tests/worker_agent3_plan_store.py
          python tests/worker_agent3_planner_review.py
          python tests/worker_agent3_planner_capability_binding.py
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
      - name: Run focused Android reviewed Start tests
        working-directory: android
        run: |
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
          ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest --tests 'dk.ternedal.modelrig.net.Agent3ReviewedStartDurableRecoveryTest' --tests 'dk.ternedal.modelrig.data.Agent3ReviewedStartRecoveryStoreTest' --no-daemon --console=plain
      - name: Run focused desktop reviewed Start tests
        working-directory: desktop
        run: ./gradlew :composeApp:test --tests 'dk.ternedal.modelrig.desktop.net.Agent3ReviewedStartDurableRecoveryTest' --tests 'dk.ternedal.modelrig.desktop.data.Agent3ReviewedStartRecoveryStoreTest' --no-daemon --console=plain
      - name: Syntax and diff gate
        run: |
          python -m py_compile worker/app/agent3/plan_store.py worker/app/agent3/core.py worker/app/agent3/review_orchestrator.py worker/app/agent3/planner.py tests/worker_agent3_reviewed_start_recovery.py
          git diff --check

          new = '''    def _blocked_run(\n        self,\n        request: TurnRequest,\n        route: RoutePlan,\n        reason: str,\n        proactive: bool,\n        allow_private_cloud: bool,\n        steps: list[AgentStep] | None = None,\n        *,\n        run_id: str | None = None,\n    ) -> AgentRun:\n'''

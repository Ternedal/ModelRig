          new = '''        run = AgentRun(\n            request=request,\n            route=route,\n            steps=steps,\n            id=run_id or str(uuid.uuid4()),\n            proactive=proactive,\n            allow_private_cloud=allow_private_cloud,\n        )\n'''
          if text.count(old) < 1:

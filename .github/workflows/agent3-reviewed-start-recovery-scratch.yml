name: agent3-reviewed-start-recovery-scratch

on:
  push:
    branches:
      - fix/agent3-reviewed-start-durable-recovery-1309
    paths:
      - .github/workflows/agent3-reviewed-start-recovery-scratch.yml

permissions:
  contents: write

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/agent3-reviewed-start-durable-recovery-1309
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply final reviewed Start QA patch
        run: |
          python .github/scripts/agent3_reviewed_start_final_qa_patch.py
          gofmt -w backend/internal/proxy/proxy.go backend/internal/proxy/proxy_test.go
          git diff --check
      - name: Install worker dependencies
        run: python -m pip install -r worker/requirements.txt
      - name: Run focused worker recovery tests
        env:
          PYTHONPATH: worker
        run: |
          python tests/worker_agent3_reviewed_start_recovery.py
          python tests/worker_agent3_plan_store.py
          python tests/worker_agent3_planner_review.py
          python tests/worker_agent3_planner_capability_binding.py
          python tests/worker_agent3_capability_receipt_api.py
          python tests/worker_agent3_review_api_resume.py
      - name: Run gateway proxy tests
        working-directory: backend
        run: go test ./internal/proxy
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
      - name: Compile Android and run reviewed Start recovery tests
        working-directory: android
        run: |
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
          ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest \
            --tests 'dk.ternedal.modelrig.net.Agent3ReviewedStartDurableRecoveryTest' \
            --tests 'dk.ternedal.modelrig.data.Agent3ReviewedStartRecoveryStoreTest' \
            --tests 'dk.ternedal.modelrig.data.Agent3ReviewedStartRecoveryPersistenceTest' \
            --no-daemon --console=plain
      - name: Desktop durable recovery contract
        if: always()
        working-directory: desktop
        run: ./gradlew :composeApp:test --tests 'dk.ternedal.modelrig.desktop.net.Agent3ReviewedStartDurableRecoveryTest' --no-daemon --console=plain
      - name: Desktop recovery key scope
        if: always()
        working-directory: desktop
        run: ./gradlew :composeApp:test --tests 'dk.ternedal.modelrig.desktop.data.Agent3ReviewedStartRecoveryStoreTest' --no-daemon --console=plain
      - name: Desktop restart persistence
        if: always()
        working-directory: desktop
        run: ./gradlew :composeApp:test --tests 'dk.ternedal.modelrig.desktop.data.Agent3ReviewedStartRecoveryPersistenceTest' --no-daemon --console=plain
      - name: Syntax and diff gate
        if: always()
        run: |
          python -m py_compile worker/app/agent3/plan_store.py worker/app/agent3/core.py worker/app/agent3/review_orchestrator.py worker/app/agent3/planner.py tests/worker_agent3_reviewed_start_recovery.py tests/worker_agent3_planner_review.py
          git diff --check
      - name: Commit qualified product fixes
        run: |
          git config user.name "Agent3 recovery QA"
          git config user.email "actions@users.noreply.github.com"
          git add \
            worker/app/agent3/planner.py \
            tests/worker_agent3_planner_review.py \
            backend/internal/proxy/proxy.go \
            backend/internal/proxy/proxy_test.go
          git diff --cached --quiet && exit 0
          git commit -m "fix(agent3): close reviewed Start recovery QA gaps (#1309)"
          git push origin HEAD:fix/agent3-reviewed-start-durable-recovery-1309

name: Temporary controlled A4-20 integration merge

on:
  pull_request:

permissions:
  contents: write

jobs:
  merge-qualified-a420:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/a4-read-product-integration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Fetch and verify qualified A4-20 head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/a4-20-android-response-epoch
          actual="$(git rev-parse origin/agent/a4-20-android-response-epoch)"
          expected="1536c2e48559c9ec7813641f2a50fa76cc524efc"
          test "$actual" = "$expected" || {
            echo "A4-20 head moved: expected $expected, got $actual" >&2
            exit 1
          }

      - name: Merge with explicit conflict policy
        shell: bash
        run: |
          set -euo pipefail
          source_ref="origin/agent/a4-20-android-response-epoch"
          if git merge-base --is-ancestor "$source_ref" HEAD; then
            echo "Qualified A4-20 is already integrated"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          git merge --no-ff --no-commit "$source_ref"
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Conflicts:\n%s\n' "${conflicts[*]}"
            allowed='^(CURRENT_STATE\.md|android/app/src/main/java/dk/ternedal/modelrig/net/Agent4OperatorClient\.kt|android/app/src/main/java/dk/ternedal/modelrig/ui/(Agent4CampaignDetailScreen|Agent4OperatorPresentation|Agent4OperatorScreen|Agent4PagingPolicy)\.kt|android/app/src/test/java/dk/ternedal/modelrig/net/Agent4OperatorClientTest\.kt|android/app/src/test/java/dk/ternedal/modelrig/ui/(Agent4OperatorPresentationTest|Agent4PagingPolicyTest)\.kt|docs/AGENT_4_A4_17_ANDROID_READ_CLIENT\.md|docs/AGENT_4_A4_19_CAMPAIGN_LIST_PAGING\.md|tests/worker_agent4_campaign_list_(api|query)\.py|tests/workflow_agent4_campaign_list_paging\.py|worker/app/agent4/(campaign_list_query|operator|operator_api)\.py)$'
            for path in "${conflicts[@]}"; do
              if [[ ! "$path" =~ $allowed ]]; then
                echo "Unexpected conflict: $path" >&2
                git merge --abort
                exit 1
              fi
              git checkout --theirs -- "$path"
              git add "$path"
            done
            remaining="$(git diff --name-only --diff-filter=U)"
            test -z "$remaining" || {
              echo "Unresolved conflicts remain: $remaining" >&2
              exit 1
            }
          fi

          python -m pip install -r worker/requirements.txt
          python scripts/current_state.py
          PYTHONPATH=worker python tests/workflow_agent4_read_product_integration.py
          PYTHONPATH=worker python tests/workflow_agent4_campaign_list_paging.py
          python scripts/current_state.py --check

          git add -A
          git commit -m "merge(agent4): refresh integration with A4-19 and A4-20"
          git push origin HEAD:agent/a4-read-product-integration

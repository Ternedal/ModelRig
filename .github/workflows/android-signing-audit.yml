name: android-signing-audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-tracked-signing-material:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify signing audit path matching
        run: python3 -m unittest discover -s tests -p workflow_android_signing_audit.py -v
      - name: Audit tracked signing files (non-blocking during migration)
        run: python3 scripts/audit_android_signing.py

name: Execute one-time safe branch cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/execute-safe-branch-cleanup-once.yml"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: execute-safe-branch-cleanup-once
  cancel-in-progress: false

jobs:
  cleanup:
    if: startsWith(github.event.head_commit.message, 'chore(repo): execute one-time safe branch cleanup')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Execute verified merged branch cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BASE_BRANCH: main
          EXECUTE: "true"
          MIN_AGE_DAYS: "7"
        run: bash scripts/safe_branch_cleanup.sh

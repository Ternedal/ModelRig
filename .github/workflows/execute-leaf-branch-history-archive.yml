name: Execute leaf branch history archive

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/execute-leaf-branch-history-archive.yml"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: execute-leaf-branch-history-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build, push, verify and compact leaf history
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BASE_BRANCH: main
          MIN_AGE_DAYS: "7"
          EXECUTE: "true"
          ARCHIVE_BRANCH: archive/leaf-history-20261003
        run: python3 scripts/execute_leaf_branch_history_archive.py

name: patch-desktop-partial-error-redaction

on:
  push:
    branches:
      - helper/patch-desktop-partial-error-redaction

permissions:
  contents: write

jobs:
  patch-and-qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/desktop-partial-error-redaction
          fetch-depth: 0

      - name: Assert exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c747e88bf61f45bd0ef9f26291fe4f69ab0d2cae"
          test -z "$(git status --porcelain)"

      - name: Apply bounded partial-error presentation fix
        shell: python
        run: |
          from pathlib import Path
          path = Path("desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/App.kt")
          text = path.read_text(encoding="utf-8")
          old = 'else cur.text + "\\n[afbrudt: ${err.message}]"'
          new = 'else cur.text + "\\n[afbrudt: ${apiErrorHint(err.message)}]"'
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one raw partial-error interpolation, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")

      - name: Assert bounded diff and privacy guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/App.kt"
          ! grep -F 'else cur.text + "\n[afbrudt: ${err.message}]"' desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/App.kt
          grep -F 'else cur.text + "\n[afbrudt: ${apiErrorHint(err.message)}]"' desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/App.kt

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '21'

      - name: Run desktop tests
        working-directory: desktop
        run: ./gradlew :composeApp:test --no-daemon

      - name: Commit qualified product change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/composeApp/src/main/kotlin/dk/ternedal/modelrig/desktop/App.kt
          git commit -m "fix(desktop): redact partial chat failure details"
          test "$(git rev-parse HEAD^)" = "c747e88bf61f45bd0ef9f26291fe4f69ab0d2cae"
          test -z "$(git status --porcelain)"
          git push origin HEAD:fix/desktop-partial-error-redaction

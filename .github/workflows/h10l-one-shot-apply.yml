name: h10l-one-shot-apply

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/devcontrol-foundation-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Verify H10K starting identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object devcontrol/src/kaliv_dev_control/_tier_a_execution_core.py)" = "4f4efeef36ac44fd2337972c29b99c0f9cb0a373"
          test "$(git hash-object devcontrol/src/kaliv_dev_control/_tier_a_environment.py)" = "51bfa325bd8284525604eb7faac3dce10b41a63a"

      - name: Materialize verified H10L payload
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/h10l-payload-1.b64 \
            .github/h10l-payload-2.b64 \
            .github/h10l-payload-3.b64 \
            .github/h10l-payload-4.b64 > /tmp/h10l.b64
          base64 --decode /tmp/h10l.b64 > /tmp/h10l.tar.gz
          echo "086e7eded45eea0873c8ff5a69f8c9104d417a593ca3f1e7c16ce5f5b06e414e  /tmp/h10l.tar.gz" | sha256sum --check
          tar -tzf /tmp/h10l.tar.gz | sort > /tmp/h10l-paths.txt
          cat > /tmp/h10l-expected-paths.txt <<'EOF'
          devcontrol/TIER_A_BUNDLE_INVENTORY.json
          devcontrol/TIER_A_BUNDLE_INVENTORY.md
          devcontrol/TIER_A_EXECUTION_CORE_SPLIT_CONTRACT.json
          devcontrol/TIER_A_EXECUTION_CORE_SPLIT_CONTRACT.md
          devcontrol/src/kaliv_dev_control/_tier_a_environment.py
          devcontrol/src/kaliv_dev_control/_tier_a_execution_core.py
          devcontrol/src/kaliv_dev_control/_tier_a_lease.py
          devcontrol/src/kaliv_dev_control/tier_a_authority.py
          devcontrol/tests/test_h10j_tier_a_execution_core_split_contract.py
          devcontrol/tests/test_h10l_tier_a_error_extraction.py
          EOF
          sed -i 's/^          //' /tmp/h10l-expected-paths.txt
          diff -u /tmp/h10l-expected-paths.txt /tmp/h10l-paths.txt
          tar -xzf /tmp/h10l.tar.gz

      - name: Verify exact H10L Git identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object devcontrol/src/kaliv_dev_control/_tier_a_lease.py)" = "1f4a6eac5b9f0874bbb12897f690f8ae2ee9efe1"
          test "$(git hash-object devcontrol/src/kaliv_dev_control/_tier_a_environment.py)" = "68cee74aa519e41cb9b8e3a5e74e3dbb90a6d78d"
          test "$(git hash-object devcontrol/src/kaliv_dev_control/_tier_a_execution_core.py)" = "1b4779a456fb98ce42f9938a577ec1588957d419"
          test "$(git hash-object devcontrol/src/kaliv_dev_control/tier_a_authority.py)" = "f93f5ea43b2dd4476bdbe739228edded65e109b1"
          test "$(git hash-object devcontrol/TIER_A_BUNDLE_INVENTORY.json)" = "42260b5ebe4be752ca5b8d6dbfa368a7c9a7a9d1"
          test "$(git hash-object devcontrol/TIER_A_BUNDLE_INVENTORY.md)" = "0b62809775955fe5109e2d614a32f3788e8573d3"
          test "$(git hash-object devcontrol/TIER_A_EXECUTION_CORE_SPLIT_CONTRACT.json)" = "c297215b0b27a69565b1c0277a1c426f138fcb3a"
          test "$(git hash-object devcontrol/TIER_A_EXECUTION_CORE_SPLIT_CONTRACT.md)" = "3ccfdb4515ab36658c7208500b2db82618277204"
          test "$(git hash-object devcontrol/tests/test_h10j_tier_a_execution_core_split_contract.py)" = "0d87cf3c49f94001b21f888335d720bbb13cfc0c"
          test "$(git hash-object devcontrol/tests/test_h10l_tier_a_error_extraction.py)" = "959a91e51672f4a1b825edc386fffcc86fbd7a39"

      - name: Install worker dependencies
        run: python -m pip install -r worker/requirements.txt

      - name: Validate portable H10L contracts
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/devcontrol/src:$PWD/worker"
          python scripts/tier_a_bundle_inventory.py --check
          python -m unittest -v \
            devcontrol.tests.test_h10i_tier_a_bundle_inventory \
            devcontrol.tests.test_h10j_tier_a_execution_core_split_contract \
            devcontrol.tests.test_h10k_tier_a_environment_extraction \
            devcontrol.tests.test_h10l_tier_a_error_extraction \
            devcontrol.tests.test_tier_a_authority_bundle_closure

      - name: Commit exact H10L extraction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ModelRig H10L apply"
          git config user.email "actions@users.noreply.github.com"
          git add \
            devcontrol/src/kaliv_dev_control/_tier_a_lease.py \
            devcontrol/src/kaliv_dev_control/_tier_a_environment.py \
            devcontrol/src/kaliv_dev_control/_tier_a_execution_core.py \
            devcontrol/src/kaliv_dev_control/tier_a_authority.py \
            devcontrol/TIER_A_BUNDLE_INVENTORY.json \
            devcontrol/TIER_A_BUNDLE_INVENTORY.md \
            devcontrol/TIER_A_EXECUTION_CORE_SPLIT_CONTRACT.json \
            devcontrol/TIER_A_EXECUTION_CORE_SPLIT_CONTRACT.md \
            devcontrol/tests/test_h10j_tier_a_execution_core_split_contract.py \
            devcontrol/tests/test_h10l_tier_a_error_extraction.py
          git diff --cached --check
          git commit -m "refactor(devcontrol): extract Tier-A error identity (H10L)"
          git push origin HEAD:agent/devcontrol-foundation-v1

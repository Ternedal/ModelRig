name: Temporary A4-20 Android debug

on:
  pull_request:

permissions:
  contents: read

jobs:
  debug-agent4-operator-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pull-request merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Install platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Run focused tests and print XML
        working-directory: android
        shell: bash
        run: |
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
          set +e
          ./gradlew :app:testDebugUnitTest \
            --tests 'dk.ternedal.modelrig.net.Agent4OperatorClientTest' \
            --no-daemon --console=plain
          status=$?
          set -e
          find app/build/test-results/testDebugUnitTest -name 'TEST-*.xml' -print -exec cat {} \;
          exit "$status"

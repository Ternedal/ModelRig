name: release-queue-cleanup-v2.0.16

# One-use cleanup of two superseded PR runs. This branch is not merged.
on:
  push:
    branches: [release/queue-cleanup-v2.0.16-20261019]
    paths: [.github/workflows/release-queue-cleanup-v2.0.16.yml]

permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  group: release-queue-cleanup-v2.0.16-20261019
  cancel-in-progress: false

jobs:
  cancel-only-superseded-pr-runs:
    if: github.repository == 'Ternedal/ModelRig' && github.ref == 'refs/heads/release/queue-cleanup-v2.0.16-20261019'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Verify release authority and cancel only the two obsolete PR runs
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          REPO = "Ternedal/ModelRig"
          SOURCE = "c984f64345fbbcb079b12ee3e7295deb4075d9dc"
          WORKFLOW = ".github/workflows/exact-head-qualification.yml"
          TARGETS = (
              (39271927600, 2236, "feat/wan-video-generation", "2b0b020854f2c7881de80d825328a53e5d1dbc71"),
              (39271811883, 2225, "feature/qwen-image-21-integration-plan", "92d27012450a49033786e88d0e053afffc05b7d7"),
          )

          def api(path, method="GET"):
              request = urllib.request.Request(
                  "https://api.github.com/repos/" + REPO + "/" + path,
                  data=b"" if method == "POST" else None,
                  method=method,
                  headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = response.read()
                  return json.loads(body) if body else None

          release_run = api("actions/runs/39272207242")
          assert release_run["name"] == "build-and-release"
          assert release_run["head_sha"] == SOURCE
          assert release_run["head_branch"] == "v2.0.16"
          if release_run["status"] == "completed":
              print("Release run is already complete; no cleanup performed.")
              sys.exit(0)
          release = api("releases/417102107")
          assert release["tag_name"] == "v2.0.16" and release["draft"] is True
          assert api("git/ref/tags/v2.0.16")["object"]["sha"] == SOURCE

          for run_id, pr_number, branch, obsolete_sha in TARGETS:
              run = api(f"actions/runs/{run_id}")
              assert run["id"] == run_id and run["event"] == "pull_request"
              assert run["name"] == "exact-head-qualification" and run["path"] == WORKFLOW
              assert run["head_branch"] == branch and run["head_sha"] == obsolete_sha
              assert run["head_repository"]["full_name"] == REPO
              assert any(pr["number"] == pr_number for pr in run["pull_requests"])
              if run["status"] == "completed":
                  print(f"Run {run_id} already completed; unchanged.")
                  continue

              pr = api(f"pulls/{pr_number}")
              assert pr["state"] == "open" and pr["base"]["ref"] == "main"
              assert pr["head"]["ref"] == branch and pr["head"]["repo"]["full_name"] == REPO
              current_sha = api("git/ref/heads/" + urllib.parse.quote(branch, safe="/"))["object"]["sha"]
              assert current_sha == pr["head"]["sha"] and current_sha != obsolete_sha

              replacements = api("actions/runs?" + urllib.parse.urlencode({
                  "head_sha": current_sha, "event": "pull_request", "per_page": 100,
              }))["workflow_runs"]
              assert any(
                  item["id"] != run_id and item["path"] == WORKFLOW
                  and item["head_sha"] == current_sha and item["head_branch"] == branch
                  and (item["status"] != "completed" or item["conclusion"] == "success")
                  for item in replacements
              ), "A qualification run for the current PR head must already exist"

              try:
                  api(f"actions/runs/{run_id}/cancel", method="POST")
              except urllib.error.HTTPError as error:
                  if error.code != 409 or api(f"actions/runs/{run_id}")["status"] != "completed":
                      raise
                  print(f"Run {run_id} completed before cancellation; unchanged.")
              else:
                  print(f"Cancellation requested for superseded PR #{pr_number} run {run_id} ({obsolete_sha}).")
          PY

name: h10k-source-materialization

on:
  push:
    branches:
      - agent/devcontrol-foundation-v1

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Package H10K source tree
        run: tar -czf /tmp/h10k-source.tgz devcontrol worker/app
      - name: Upload H10K source tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: h10k-source-tree
          path: /tmp/h10k-source.tgz
          if-no-files-found: error
          retention-days: 1

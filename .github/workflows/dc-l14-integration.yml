name: dc-l14-integration

on:
  pull_request:
    paths:
      - '.github/workflows/dc-l14-integration.yml'
      - '.github/dc-l14-integrate.py'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/devcontrol-dc-l14-final-authority-closure
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install exact integration dependencies
        run: pip install --quiet -r worker/requirements.txt build==1.3.0 wheel==0.46.2 setuptools==75.8.2
      - name: Project repository integration
        run: |
          python .github/dc-l14-integrate.py
          python - <<'PY'
          from pathlib import Path
          path = Path('devcontrol/README.md')
          path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
      - name: Validate all DevControl and workflow contracts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: devcontrol/src
        run: |
          python -m unittest discover -s devcontrol/tests -p 'test_*.py' -v
          python tests/workflow_test_coverage.py
          python scripts/tier_a_bundle_inventory.py --check
          git diff --check
      - name: Commit verified integration
        run: |
          rm .github/dc-l14-integrate.py .github/workflows/dc-l14-integration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci(devcontrol): integrate DC-L14 final closure gates'
          echo "candidate=$(git rev-parse HEAD)"
          git push origin HEAD:agent/devcontrol-dc-l14-final-authority-closure

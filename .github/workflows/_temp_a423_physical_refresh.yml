name: Temporary A4-23 physical refresh

on:
  pull_request:

permissions:
  contents: write

jobs:
  refresh-and-validate:
    if: github.event.pull_request.head.ref == 'agent/a4-18-physical-read-product' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact physical branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/a4-18-physical-read-product
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install worker dependencies
        run: python -m pip install -r worker/requirements.txt

      - name: Verify pinned physical and integration inputs
        shell: bash
        run: |
          set -euo pipefail
          expected_physical="61894626d921ac90df34685e4feb0feb8f3389af"
          expected_integration="be070b9a7f9eedcef076545ab0a79c661f70e3d0"
          expected_merge_base="2f4849b7621b71651e61e7a6f54488fda37f7762"

          git merge-base --is-ancestor "$expected_physical" HEAD || {
            echo "qualified physical head is no longer an ancestor" >&2
            exit 1
          }
          temp_changes="$(git diff --name-only "$expected_physical"..HEAD)"
          if [ "$temp_changes" != ".github/workflows/_temp_a423_physical_refresh.yml" ]; then
            echo "unexpected changes above qualified physical head:" >&2
            printf '%s\n' "$temp_changes" >&2
            exit 1
          fi

          git fetch origin agent/a4-read-product-integration
          actual_integration="$(git rev-parse origin/agent/a4-read-product-integration)"
          test "$actual_integration" = "$expected_integration" || {
            echo "integration moved: expected $expected_integration, got $actual_integration" >&2
            exit 1
          }
          actual_merge_base="$(git merge-base "$expected_physical" "$expected_integration")"
          test "$actual_merge_base" = "$expected_merge_base" || {
            echo "unexpected merge base: expected $expected_merge_base, got $actual_merge_base" >&2
            exit 1
          }

      - name: Merge exact qualified integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          git merge --no-ff --no-commit be070b9a7f9eedcef076545ab0a79c661f70e3d0
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicts" != "CURRENT_STATE.md" ]; then
              echo "unexpected merge conflicts:" >&2
              printf '%s\n' "$conflicts" >&2
              exit 1
            fi
            git checkout --theirs CURRENT_STATE.md
            git add CURRENT_STATE.md
          fi

      - name: Prove A4-18 harness stayed byte-for-byte unchanged
        shell: bash
        run: |
          set -euo pipefail
          physical="61894626d921ac90df34685e4feb0feb8f3389af"
          merge_base="2f4849b7621b71651e61e7a6f54488fda37f7762"
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            [ "$path" = "CURRENT_STATE.md" ] && continue
            test -f "$path" || {
              echo "physical harness path disappeared: $path" >&2
              exit 1
            }
            old_blob="$(git rev-parse "$physical:$path")"
            new_blob="$(git hash-object "$path")"
            test "$old_blob" = "$new_blob" || {
              echo "physical harness path changed: $path" >&2
              exit 1
            }
          done < <(git diff --name-only "$merge_base" "$physical")

      - name: Run A4-23, read-product and physical contracts
        env:
          PYTHONPATH: worker
        shell: bash
        run: |
          set -euo pipefail
          (cd backend && go test ./cmd/modelrig-server -count=1)
          python tests/worker_agent4_a4_23_filter_before_summary.py
          python tests/workflow_agent4_a4_22_single_writer_pairing.py
          python tests/worker_agent4_production_bootstrap.py
          python tests/worker_agent4_production_read_mutation_boundary.py
          python tests/worker_agent4_campaign_list_query.py
          python tests/worker_agent4_campaign_list_api.py
          python tests/workflow_agent4_campaign_list_paging.py
          python tests/workflow_agent4_read_product_integration.py
          for test_file in tests/workflow_agent4_physical_read_*.py; do
            echo "==> $test_file"
            python "$test_file"
          done

      - name: Regenerate authoritative current state
        run: |
          python scripts/current_state.py
          python scripts/current_state.py --check

      - name: Commit and push controlled physical refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CURRENT_STATE.md
          git commit -m "merge(agent4): refresh physical candidate from qualified A4-23 integration"
          git push origin HEAD:agent/a4-18-physical-read-product

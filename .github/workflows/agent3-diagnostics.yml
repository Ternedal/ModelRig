name: agent3-diagnostics

# candidate_freeze_check.py kraever dette workflow GROENT paa kandidatens
# eksakte head. Et path-filter gjorde det kravet uopfyldeligt: enhver landing
# der ikke roerte agent3-stier (fx en docs-commit) efterlod en head uden
# koersel, og frysningen kunne ikke passere uden at flytte SHA'en. Trigger
# derfor paa hver PR — som agent3-full-diagnostics allerede goer — plus
# workflow_dispatch som manuel udvej for en head der allerede findes.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent3-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact checkout authority
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA" || {
            echo "checkout authority mismatch: expected $EXPECTED_SHA, got $actual" >&2
            exit 1
          }
          echo "exact checkout authority: $actual"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install worker deps
        run: pip install -r worker/requirements.txt --break-system-packages
      - name: Run Agent 3.0 tests with full log
        run: |
          set -o pipefail
          : > /tmp/agent3-test-suite.log
          status=0
          for f in tests/worker_agent3_*.py; do
            [ -e "$f" ] || continue
            echo "===== $f =====" | tee -a /tmp/agent3-test-suite.log
            PYTHONPATH=worker python3 "$f" 2>&1 | tee -a /tmp/agent3-test-suite.log || {
              status=${PIPESTATUS[0]}
              echo "FAILED: $f (exit $status)" | tee -a /tmp/agent3-test-suite.log
              break
            }
          done
          exit "$status"
      - name: Upload failed Agent 3.0 log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent3-test-suite-log
          path: /tmp/agent3-test-suite.log
          if-no-files-found: error
          retention-days: 7

name: Temporary A4-20 offline verifier credential hardening

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate-and-regenerate:
    if: github.event.pull_request.head.ref == 'agent/a4-20-offline-physical-receipt-verifier' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact verifier branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/a4-20-offline-physical-receipt-verifier
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install worker dependencies
        run: python -m pip install -r worker/requirements.txt

      - name: Legacy valid receipt passes
        run: python tests/workflow_agent4_physical_receipt_offline_verifier.py OfflineReceiptVerifierTests.test_valid_receipt_passes
      - name: Legacy main digest tamper rejects
        run: python tests/workflow_agent4_physical_receipt_offline_verifier.py OfflineReceiptVerifierTests.test_main_digest_tamper_is_rejected_without_resigning
      - name: Legacy resigned NO-GO rejects
        run: python tests/workflow_agent4_physical_receipt_offline_verifier.py OfflineReceiptVerifierTests.test_resigned_no_go_receipt_is_still_rejected_semantically
      - name: Legacy wrong expected head rejects
        run: python tests/workflow_agent4_physical_receipt_offline_verifier.py OfflineReceiptVerifierTests.test_wrong_expected_head_is_rejected_even_after_resigning
      - name: Legacy checkpoint set rejects drift
        run: python tests/workflow_agent4_physical_receipt_offline_verifier.py OfflineReceiptVerifierTests.test_missing_or_unknown_checkpoint_is_rejected
      - name: Legacy wrong HTTP status rejects
        run: python tests/workflow_agent4_physical_receipt_offline_verifier.py OfflineReceiptVerifierTests.test_resigned_wrong_http_status_is_rejected
      - name: Legacy invalid payload hash rejects
        run: python tests/workflow_agent4_physical_receipt_offline_verifier.py OfflineReceiptVerifierTests.test_invalid_payload_hash_is_rejected
      - name: Legacy raw screenshot path rejects
        run: python tests/workflow_agent4_physical_receipt_offline_verifier.py OfflineReceiptVerifierTests.test_raw_screenshot_path_is_rejected
      - name: Legacy mutation partial resign rejects
        run: python tests/workflow_agent4_physical_receipt_offline_verifier.py OfflineReceiptVerifierTests.test_mutation_edit_with_only_main_resign_is_rejected
      - name: Legacy cleanup failure rejects
        run: python tests/workflow_agent4_physical_receipt_offline_verifier.py OfflineReceiptVerifierTests.test_cleanup_failure_is_rejected_after_resigning
      - name: Legacy public network rejects
        run: python tests/workflow_agent4_physical_receipt_offline_verifier.py OfflineReceiptVerifierTests.test_public_network_is_rejected_after_resigning
      - name: Legacy emulator identity rejects
        run: python tests/workflow_agent4_physical_receipt_offline_verifier.py OfflineReceiptVerifierTests.test_non_pixel_or_emulator_identity_is_rejected
      - name: Legacy credential key rejects
        run: python tests/workflow_agent4_physical_receipt_offline_verifier.py OfflineReceiptVerifierTests.test_credential_key_is_rejected_even_when_main_digest_is_valid
      - name: Legacy credential-like value rejects
        run: python tests/workflow_agent4_physical_receipt_offline_verifier.py OfflineReceiptVerifierTests.test_credential_like_value_is_rejected
      - name: Legacy artifact traversal rejects
        run: python tests/workflow_agent4_physical_receipt_offline_verifier.py OfflineReceiptVerifierTests.test_bad_artifact_path_is_rejected
      - name: Legacy CLI is read-only and reports PASS FAIL
        run: python tests/workflow_agent4_physical_receipt_offline_verifier.py OfflineReceiptVerifierTests.test_cli_emits_machine_and_human_pass_fail_without_mutating_receipt
      - name: Legacy verifier source authority remains narrow
        run: python tests/workflow_agent4_physical_receipt_offline_verifier.py OfflineReceiptVerifierTests.test_verifier_source_has_no_network_process_or_write_authority

      - name: Reject camelCase deviceToken
        run: python tests/workflow_agent4_physical_receipt_credential_aliases.py CredentialAliasHardeningTests.test_camel_case_device_token_key_is_rejected
      - name: Reject camelCase pairingCode
        run: python tests/workflow_agent4_physical_receipt_credential_aliases.py CredentialAliasHardeningTests.test_camel_case_pairing_code_key_is_rejected
      - name: Reject kebab admin-key
        run: python tests/workflow_agent4_physical_receipt_credential_aliases.py CredentialAliasHardeningTests.test_kebab_case_admin_key_is_rejected
      - name: Reject AuthorizationHeader alias
        run: python tests/workflow_agent4_physical_receipt_credential_aliases.py CredentialAliasHardeningTests.test_authorization_header_alias_is_rejected
      - name: Reject nested clientSecretValue alias
        run: python tests/workflow_agent4_physical_receipt_credential_aliases.py CredentialAliasHardeningTests.test_nested_client_secret_alias_is_rejected
      - name: Reject unlabeled raw pairing code
        run: python tests/workflow_agent4_physical_receipt_credential_aliases.py CredentialAliasHardeningTests.test_unlabelled_raw_pairing_code_in_note_is_rejected
      - name: Allow noncredential metadata aliases
        run: python tests/workflow_agent4_physical_receipt_credential_aliases.py CredentialAliasHardeningTests.test_noncredential_metadata_names_remain_allowed

      - name: Run every existing physical read repository contract
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/workflow_agent4_physical_read_*.py; do
            echo "==> $test_file"
            python "$test_file"
          done

      - name: Regenerate authoritative current state
        run: |
          python scripts/current_state.py
          python scripts/current_state.py --check

      - name: Commit generated state when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- CURRENT_STATE.md; then
            echo "CURRENT_STATE.md already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CURRENT_STATE.md
          git commit -m "docs: regenerate current state for verifier credential hardening"
          git push origin HEAD:agent/a4-20-offline-physical-receipt-verifier

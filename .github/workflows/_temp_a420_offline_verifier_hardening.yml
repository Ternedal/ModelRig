name: Temporary A4-20 offline verifier credential hardening

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate-and-regenerate:
    if: github.event.pull_request.head.ref == 'agent/a4-20-offline-physical-receipt-verifier' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact verifier branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/a4-20-offline-physical-receipt-verifier
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install worker dependencies
        run: python -m pip install -r worker/requirements.txt

      - name: Apply path-scoped cleanup evidence exception
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/agent4_physical_receipt_verify_offline.py")
          text = path.read_text(encoding="utf-8")
          old = '''def _credential_key_is_forbidden(name: str) -> bool:
              compact = re.sub(r"[^a-z0-9]", "", name.lower())
              return any(term in compact for term in FORBIDDEN_CREDENTIAL_KEY_TERMS)


          def _scan_credentials(value: Any, path: str = "root") -> None:
              if isinstance(value, Mapping):
                  for key, child in value.items():
                      name = str(key)
                      _require(not _credential_key_is_forbidden(name), f"forbidden credential field at {path}.{name}")
                      _scan_credentials(child, f"{path}.{name}")
                  return
              if isinstance(value, list):
                  for index, child in enumerate(value):
                      _scan_credentials(child, f"{path}[{index}]")
                  return
              if isinstance(value, str):
                  for pattern in CREDENTIAL_VALUE_PATTERNS:
                      _require(pattern.search(value) is None, f"credential-like value at {path}")
          '''
          new = '''def _credential_key_is_forbidden(name: str) -> bool:
              compact = re.sub(r"[^a-z0-9]", "", name.lower())
              return any(term in compact for term in FORBIDDEN_CREDENTIAL_KEY_TERMS)


          def _known_credential_evidence_marker(path: str, name: str, value: Any) -> bool:
              return (
                  path == "root.cleanup"
                  and name == "admin_key_deleted"
                  and type(value) is bool
              )


          def _scan_credentials(value: Any, path: str = "root") -> None:
              if isinstance(value, Mapping):
                  for key, child in value.items():
                      name = str(key)
                      allowed_evidence = _known_credential_evidence_marker(path, name, child)
                      _require(
                          allowed_evidence or not _credential_key_is_forbidden(name),
                          f"forbidden credential field at {path}.{name}",
                      )
                      _scan_credentials(child, f"{path}.{name}")
                  return
              if isinstance(value, list):
                  for index, child in enumerate(value):
                      _scan_credentials(child, f"{path}[{index}]")
                  return
              if isinstance(value, str):
                  for pattern in CREDENTIAL_VALUE_PATTERNS:
                      _require(pattern.search(value) is None, f"credential-like value at {path}")
          '''
          if text.count(old) != 1:
              raise SystemExit("credential scanner source no longer matches the reviewed hardening input")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Run original offline verifier adversarial contract
        run: python tests/workflow_agent4_physical_receipt_offline_verifier.py

      - name: Run credential alias hardening contract
        run: python tests/workflow_agent4_physical_receipt_credential_aliases.py

      - name: Run every existing physical read repository contract
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/workflow_agent4_physical_read_*.py; do
            echo "==> $test_file"
            python "$test_file"
          done

      - name: Regenerate authoritative current state
        run: |
          python scripts/current_state.py
          python scripts/current_state.py --check

      - name: Commit validated verifier hardening and generated state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/agent4_physical_receipt_verify_offline.py CURRENT_STATE.md
          if git diff --cached --quiet; then
            echo "validated hardening already present"
            exit 0
          fi
          git commit -m "fix(agent4): scope cleanup credential evidence exception"
          git push origin HEAD:agent/a4-20-offline-physical-receipt-verifier

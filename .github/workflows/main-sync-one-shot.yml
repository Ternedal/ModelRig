name: main-sync-one-shot

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/devcontrol-foundation-v1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/devcontrol-foundation-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: backend/go.mod

      - name: Verify exact sync inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-list --count 74e75cd5636f3b2994088e78c09a343cacf50c2a..HEAD)" = "2"
          test "$(git diff --name-only 74e75cd5636f3b2994088e78c09a343cacf50c2a HEAD)" = ".github/workflows/main-sync-one-shot.yml"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "11dcd7b072dd2272f84ef3801f5a9501b8aad601"
          echo "STAGING_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Merge exact main head without conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ModelRig main sync"
          git config user.email "actions@users.noreply.github.com"
          git merge --no-ff --no-edit 11dcd7b072dd2272f84ef3801f5a9501b8aad601
          test "$(git rev-parse HEAD^1)" = "$STAGING_HEAD"
          test "$(git rev-parse HEAD^2)" = "11dcd7b072dd2272f84ef3801f5a9501b8aad601"
          git diff --check HEAD^1..HEAD
          git diff --name-only HEAD^1 HEAD | sort > /tmp/actual-main-paths.txt
          cat > /tmp/expected-main-paths.txt <<'EOF'
          ACTIVATION_READINESS.md
          AGENT3_WRITE_PILOT_CURRENT_MAIN.md
          CURRENT_STATE.md
          VERSION
          android/app/build.gradle.kts
          backend/internal/config/config.go
          desktop/composeApp/build.gradle.kts
          scripts/agent3_readonly_pilot_one_click.py
          scripts/agent3_write_pilot_current_main.py
          scripts/candidate_freeze_check.py
          scripts/scheduler_pilot_wizard.py
          scripts/stage_a_one_click.py
          scripts/stage_a_physical_operator.py
          scripts/stage_a_scheduler_crash_recovery.py
          scripts/stage_a_scheduler_pilot_easy.py
          tests/workflow_agent3_readonly_pilot_one_click.py
          tests/workflow_candidate_freeze.py
          tests/workflow_remaining_physical_pilots.py
          tests/workflow_scheduler_pilot_wizard.py
          tests/workflow_stage_a_one_click.py
          tests/workflow_stage_a_physical_operator.py
          tests/workflow_stage_a_scheduler_easy.py
          worker/app/main.py
          EOF
          sed -i 's/^          //' /tmp/expected-main-paths.txt
          sort -o /tmp/expected-main-paths.txt /tmp/expected-main-paths.txt
          diff -u /tmp/expected-main-paths.txt /tmp/actual-main-paths.txt

      - name: Install worker dependencies
        run: python -m pip install -r worker/requirements.txt

      - name: Validate synchronized tree
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/devcontrol/src:$PWD/worker"
          python scripts/tier_a_bundle_inventory.py --check
          python -m compileall -q devcontrol/src devcontrol/tests
          python -m unittest discover -s devcontrol/tests -v
          python tests/workflow_candidate_freeze.py
          python tests/workflow_remaining_physical_pilots.py
          python tests/workflow_scheduler_pilot_wizard.py
          python tests/workflow_stage_a_one_click.py
          python tests/workflow_stage_a_physical_operator.py
          python tests/workflow_stage_a_scheduler_easy.py
          python tests/workflow_agent3_readonly_pilot_one_click.py
          python tests/workflow_current_state.py
          python tests/workflow_activation_readiness.py
          python tests/workflow_test_coverage.py
          (cd backend && go test ./...)

      - name: Push exact merge commit
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:agent/devcontrol-foundation-v1

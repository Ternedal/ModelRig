name: _stage-b-slices

on:
  workflow_call:
    inputs:
      head_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  stage-b-admission:
    name: stage-b-admission
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha }}
      - name: Assert exact checkout authority
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.head_sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA" || {
            echo "checkout authority mismatch: expected $EXPECTED_SHA, got $actual" >&2
            exit 1
          }

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install worker deps
        run: pip install -r worker/requirements.txt --break-system-packages

      - name: Build backend
        run: cd backend && go build -o /tmp/modelrig-server ./cmd/modelrig-server

      - name: Run Stage-B admission and publish canonical cache root
        env:
          MODELRIG_BIN: /tmp/modelrig-server
          MODELRIG_STAGE_B_SLICE: admission
          MODELRIG_STAGE_B_CACHE_ROOT: ${{ runner.temp }}/modelrig-stage-b-cache
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: PYTHONPATH=worker python3 -u tests/workflow_stage_b_physical_gate.py

      - name: Upload exact-head Stage-B cache
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage-b-cache-${{ inputs.head_sha }}
          path: ${{ runner.temp }}/modelrig-stage-b-cache
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
          overwrite: false
          include-hidden-files: true

  stage-b-shard:
    needs: stage-b-admission
    name: stage-b-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: midchain-1
            slice: midchain
            shard: "1/3"
          - name: midchain-2
            slice: midchain
            shard: "2/3"
          - name: midchain-3
            slice: midchain
            shard: "3/3"
          - name: downstream-1
            slice: downstream
            shard: "1/3"
          - name: downstream-2
            slice: downstream
            shard: "2/3"
          - name: downstream-3
            slice: downstream
            shard: "3/3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha }}
      - name: Assert exact checkout authority
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.head_sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA" || {
            echo "checkout authority mismatch: expected $EXPECTED_SHA, got $actual" >&2
            exit 1
          }

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install worker deps
        run: pip install -r worker/requirements.txt --break-system-packages

      - name: Build backend
        run: cd backend && go build -o /tmp/modelrig-server ./cmd/modelrig-server

      - name: Download exact-head Stage-B cache
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stage-b-cache-${{ inputs.head_sha }}
          path: ${{ runner.temp }}/modelrig-stage-b-cache

      - name: Run bounded Stage-B shard
        env:
          MODELRIG_BIN: /tmp/modelrig-server
          MODELRIG_STAGE_B_SLICE: ${{ matrix.slice }}
          MODELRIG_STAGE_B_CONTRACT_SHARD: ${{ matrix.shard }}
          MODELRIG_STAGE_B_CACHE_ROOT: ${{ runner.temp }}/modelrig-stage-b-cache
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: PYTHONPATH=worker python3 -u tests/workflow_stage_b_physical_gate.py

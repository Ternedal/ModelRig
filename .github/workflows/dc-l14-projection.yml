name: dc-l14-projection

on:
  pull_request:
    paths:
      - '.github/workflows/dc-l14-projection.yml'
      - '.github/dc-l14-project.py'
      - '.github/dc-l14-fix.py'
      - '.github/dc-l14-final-fix.py'
      - 'devcontrol/**'
      - 'scripts/tier_a_bundle_inventory.py'
      - 'scripts/build_devcontrol_artifacts.py'

permissions:
  contents: write

jobs:
  project:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/devcontrol-dc-l14-final-authority-closure
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install exact projection toolchain
        run: pip install --quiet cryptography==49.0.0 pytest==8.4.2 build==1.3.0 wheel==0.46.2 setuptools==75.8.2
      - name: Project final authority closure
        run: |
          python .github/dc-l14-project.py
          python .github/dc-l14-fix.py
          python .github/dc-l14-final-fix.py
      - name: Validate projected contracts and packages
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: devcontrol/src
        run: |
          python scripts/tier_a_bundle_inventory.py --check
          python -m pytest -q --tb=short \
            devcontrol/tests/test_h10i_tier_a_bundle_inventory.py \
            devcontrol/tests/test_h10j_tier_a_execution_core_split_contract.py \
            devcontrol/tests/test_h10p_tier_a_legacy_toolhost_extraction.py \
            devcontrol/tests/test_publisher_protocol_inventory_h10f.py \
            devcontrol/tests/test_tier_a_authority_bundle_closure.py \
            devcontrol/tests/test_dc_l14_reproducible_packaging.py
          git diff --check
      - name: Commit verified projection
        run: |
          rm .github/dc-l14-project.py .github/dc-l14-fix.py .github/dc-l14-final-fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(devcontrol): project DC-L14 final authority closure'
          git push origin HEAD:agent/devcontrol-dc-l14-final-authority-closure

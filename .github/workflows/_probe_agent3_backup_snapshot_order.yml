name: probe-agent3-backup-snapshot-order

on:
  push:
    branches:
      - probe/agent3-backup-snapshot-order-20260913

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: probe/agent3-backup-snapshot-order-20260913
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false
      - name: Run deterministic snapshot-order race probe
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/worker"
          python tests/_probe_agent3_backup_snapshot_order.py

name: tmp-fix-backup-pair-p1m

on:
  push:
    branches:
      - fix/agent3-backup-pair-atomic-p1m-20260913

permissions:
  contents: write

jobs:
  fix-and-qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/agent3-backup-pair-atomic-p1m-20260913
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false
      - name: Apply P1m fix
        run: python .tmp_fix_backup_pair_p1m.py
      - name: Install worker dependencies
        run: python -m pip install -r worker/requirements.txt
      - name: Compile touched Python
        run: python -m compileall -q worker/app/backup.py worker/app/agent3/core.py tests/worker_backup.py tests/worker_backup_pair_authority.py
      - name: Run focused backup authority regressions
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/worker"
          python tests/worker_backup_pair_authority.py
          python tests/worker_backup.py
      - name: Run reviewed Start safety chain
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/worker"
          for t in tests/worker_agent3_reviewed_start_p1*.py; do
            echo "==> $t"
            python "$t"
          done
          python tests/worker_agent3_late_cancel.py
          python tests/worker_agent3_plan_store.py
      - name: Regenerate canonical current state
        run: |
          python scripts/current_state.py
          python scripts/current_state.py --check
      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          grep -q 'BACKUP_SCHEMA = 4' worker/app/backup.py
          grep -q 'agent3_backup_pair' worker/app/backup.py
          grep -q 'authority-restore-in-progress' worker/app/agent3/core.py
          test -f tests/worker_backup_pair_authority.py
      - name: Commit retained P1m fix and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ternedal"
          git config user.email "a.nielbaek@gmail.com"
          git rm .tmp_fix_backup_pair_p1m.py .github/workflows/_tmp_fix_backup_pair_p1m.yml
          git add worker/app/backup.py worker/app/agent3/core.py tests/worker_backup.py tests/worker_backup_pair_authority.py CURRENT_STATE.md
          git diff --cached --check
          git commit -m "fix(agent3): bind backup authority and fence restore (#1309)" -m "Bind run/progress backup snapshots with shared attestation, fail closed across interrupted pair restore, and add P1m regressions. Draft/off-main only; production_activation=false."
          git push origin HEAD:fix/agent3-backup-pair-atomic-p1m-20260913

name: kaliv-voice-isolated-worker

# Operator-only qualification build. Never tags, publishes or replaces the V1 worker.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice-worker:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned worker dependencies and optional voice engines
        shell: pwsh
        run: |
          python -m pip install -r worker/requirements.txt
          python -m pip install "piper-tts==1.8.0" "faster-whisper" "soundfile" "pyinstaller"
          python -c "import piper, faster_whisper, soundfile; print('Voice imports OK')"
      - name: Stamp source identity and build isolated executable
        shell: pwsh
        run: |
          python scripts/stamp_build_identity.py
          pyinstaller --noconfirm --clean --onefile --name modelrig-worker-voice-test-windows-x64 --paths worker --collect-all piper --collect-all faster_whisper --collect-all ctranslate2 --collect-all soundfile --collect-all av worker/run_worker.py
      - name: Verify artifact exists
        shell: pwsh
        run: |
          $exe = "dist/modelrig-worker-voice-test-windows-x64.exe"
          if (!(Test-Path $exe)) { throw "Voice test worker was not produced" }
          Get-FileHash $exe -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: kaliv-voice-test-worker-windows-x64
          path: dist/modelrig-worker-voice-test-windows-x64.exe
          if-no-files-found: error
          retention-days: 3

name: tmp-fix-agent3-live-restore-guard-p1m

on:
  push:
    branches:
      - fix/agent3-live-restore-guard-p1m-20260913

permissions:
  contents: write

jobs:
  qualify-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/agent3-live-restore-guard-p1m-20260913
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false
      - name: Apply P1m fix
        run: python .tmp_fix_agent3_live_restore_guard_p1m.py
      - name: Install worker dependencies
        run: python -m pip install -r worker/requirements.txt
      - name: Compile changed Python
        run: python -m compileall -q worker/app/agent3 worker/app/backup.py tests/worker_backup.py
      - name: Run backup restore authority regression
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/worker"
          python tests/worker_backup.py
      - name: Run reviewed Start recovery chain
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/worker"
          for t in tests/worker_agent3_reviewed_start_p1*.py; do
            echo "==> $t"
            python "$t"
          done
          python tests/worker_agent3_cancellation_contract.py
          python tests/worker_agent3_late_cancel.py
          python tests/worker_agent3_capability_receipt_api.py
      - name: Regenerate canonical current state
        run: |
          python scripts/current_state.py
          python scripts/current_state.py --check
      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          test -f worker/app/agent3/runtime_restore_guard.py
          grep -q 'acquire_agent3_runtime_lease' worker/app/agent3/core.py
          grep -q 'agent3_restore_guard' worker/app/backup.py
          grep -q 'live Agent3 runtime is refused' tests/worker_backup.py
      - name: Commit retained P1m fix and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ternedal"
          git config user.email "a.nielbaek@gmail.com"
          git rm .tmp_fix_agent3_live_restore_guard_p1m.py .github/workflows/_tmp_fix_agent3_live_restore_guard_p1m.yml
          git add worker/app/agent3/runtime_restore_guard.py worker/app/agent3/core.py worker/app/backup.py tests/worker_backup.py scripts/BACKUP.md CURRENT_STATE.md
          git diff --cached --check
          git commit -m "fix(agent3): block live and partial-state restores (#1309)" -m "Hold a shared runtime lease for persistent AgentRunStore instances, require exclusive restore authority, and keep a durable incomplete-restore marker until the complete archive succeeds. Draft/off-main only; production_activation=false."
          git push origin HEAD:fix/agent3-live-restore-guard-p1m-20260913

  qualify-windows:
    needs: qualify-linux
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/agent3-live-restore-guard-p1m-20260913
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false
      - name: Install worker dependencies
        run: python -m pip install -r worker/requirements.txt
      - name: Run backup restore authority regression on Windows
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\worker"
          python tests/worker_backup.py

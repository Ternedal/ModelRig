name: tmp-fix-backup-progress-authority-p1o

on:
  push:
    branches:
      - fix/agent3-backup-progress-authority-p1o-20260913

permissions:
  contents: write

jobs:
  fix-and-qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/agent3-backup-progress-authority-p1o-20260913
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          check-latest: false
      - name: Apply backup authority fix
        run: python .tmp_fix_backup_progress_authority_p1o.py
      - name: Install worker dependencies
        run: python -m pip install -r worker/requirements.txt
      - name: Compile worker
        run: python -m compileall -q worker/app
      - name: Run backup and reviewed-Start authority regressions
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/worker"
          python tests/worker_backup.py
          for t in tests/worker_agent3_reviewed_start_p1*.py; do
            echo "==> $t"
            python "$t"
          done
      - name: Regenerate canonical current state
        run: |
          python scripts/current_state.py
          python scripts/current_state.py --check
      - name: Diff hygiene
        run: |
          git diff --check
          git status --short
          grep -q '_execution_progress_problem_path' worker/app/backup.py
          grep -q '_agent3_runs_row_count_path' worker/app/backup.py
          grep -q 'legacy empty Agent3 run store remains compatible' tests/worker_backup.py
      - name: Commit retained fix and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ternedal"
          git config user.email "a.nielbaek@gmail.com"
          git rm .tmp_fix_backup_progress_authority_p1o.py .github/workflows/_tmp_fix_backup_progress_authority_p1o.yml
          git add worker/app/backup.py tests/worker_backup.py CURRENT_STATE.md
          git diff --cached --check
          git commit -m "fix(agent3): validate backup execution authority (#1309)" -m "Validate execution-progress SQLite authority before create/restore, distinguish empty legacy run stores from durable run state, and keep unsafe restores fail-closed. Draft/off-main only; production_activation=false."
          git push origin HEAD:fix/agent3-backup-progress-authority-p1o-20260913

# Static security analysis for the two languages CodeQL analyzes without a
# build harness here: Go (backend) and Python (worker). Kotlin is deliberately
# absent -- CodeQL's JVM analysis needs a full build config, and the clients
# are already compile- and unit-test-gated; revisit after the Agent 3 merge.
name: codeql
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  # Merge queue (ADR-SYS-003): CodeQL is required, so the queue needs it too.
  merge_group:
    types: [checks_requested]
    branches: [main]
  schedule:
    - cron: "17 5 * * 1" # weekly, Monday morning
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [go, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4

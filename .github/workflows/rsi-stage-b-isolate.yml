name: rsi-stage-b-isolate

on:
  push:
    branches: [helper/rsi-stage-b-isolate-1401]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolate:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: adr26-requirements
            file: tests/support/rsi_pilot_execution_admission_requirements_contract.py
          - name: adr27-observation
            file: tests/support/rsi_pilot_execution_admission_observation_contract.py
          - name: adr28-attestation
            file: tests/support/rsi_pilot_execution_admission_attestation_contract.py
          - name: adr29-exact-requirements
            file: tests/support/rsi_pilot_exact_task_execution_admission_requirements_contract.py
          - name: adr30-authorization
            file: tests/support/rsi_pilot_exact_task_execution_authorization_contract.py
          - name: adr31-revalidation-observation
            file: tests/support/rsi_pilot_exact_task_execution_revalidation_observation_contract.py
          - name: adr32-revalidation-attestation
            file: tests/support/rsi_pilot_exact_task_execution_revalidation_attestation_contract.py
          - name: adr33-admission
            file: tests/support/rsi_pilot_exact_task_execution_admission_contract.py
          - name: adr33-nonce-reuse
            file: tests/support/rsi_pilot_exact_task_execution_admission_nonce_reuse_contract.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install worker deps
        run: pip install -r worker/requirements.txt --break-system-packages
      - name: Run isolated support contract
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: worker
        shell: bash
        run: |
          set -euo pipefail
          echo "START ${{ matrix.name }} :: ${{ matrix.file }}"
          started_at="$(date +%s)"
          timeout --signal=TERM --kill-after=30s 360s python3 -u "${{ matrix.file }}"
          status=$?
          elapsed=$(( $(date +%s) - started_at ))
          echo "DONE ${{ matrix.name }} ${elapsed}s exit=$status"
          exit "$status"

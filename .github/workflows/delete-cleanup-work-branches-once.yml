name: Delete final cleanup work branch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/delete-cleanup-work-branches-once.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Delete final exact cleanup branch
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          branch="chore/delete-cleanup-work-branches-20261003"
          open_count="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$branch" --json number --jq 'length')"
          if [[ "$open_count" != "0" ]]; then
            echo "OPEN_PR_SKIP $branch count=$open_count"
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
            git push origin --delete "$branch"
            echo "DELETED $branch"
          else
            echo "MISSING $branch"
          fi
